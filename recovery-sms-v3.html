<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><meta http-equiv="Pragma" content="no-cache"><title>NurseTrack SMS</title><style>body{font-family:Arial;background:#f3f8f8;color:#17343c;margin:0}.card{max-width:430px;margin:35px auto;background:#fff;padding:26px;border-radius:20px}h1{text-align:center}label{display:block;font-weight:700;margin-top:14px}input,button{width:100%;box-sizing:border-box;height:48px;margin-top:7px;border-radius:11px;font-size:16px}input{border:1px solid #ccdadd;padding:10px}button{border:0;background:#397f88;color:#fff;font-weight:700;margin-top:16px}.secondary{background:#fff;color:#397f88;border:1px solid #397f88}.phone{margin:16px 0;padding:14px;border:1px solid #cfe3df;background:#edf7f5;border-radius:12px;text-align:center;font-weight:700}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#edf7f5}.hide{display:none}</style></head><body><div class="card"><h1>Recuperación por SMS</h1><p>Recibe un código de 6 dígitos en tu teléfono registrado.</p><div class="phone">📱 Enviar código a: •••-•••-9299</div><label>Usuario o correo registrado</label><input id="id" placeholder="Usuario o correo"><button id="send">Enviar código por texto</button><div id="step2" class="hide"><label>Código recibido</label><input id="code" inputmode="numeric" maxlength="6"><label>Nueva contraseña</label><input id="p1" type="password"><label>Confirmar contraseña</label><input id="p2" type="password"><button id="save">Guardar nueva contraseña</button></div><button class="secondary" onclick="location.href='recovery-v2.html?v=3'">Volver</button><div id="msg" class="msg"></div></div><script>const endpoint='https://ummubyacvgdobgbwvwmf.supabase.co/functions/v1/recover-by-sms',apikey='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1',m=document.getElementById('msg');function show(t){m.textContent=t;m.style.display='block'}async function call(body){const r=await fetch(endpoint,{method:'POST',headers:{'content-type':'application/json','apikey':apikey,'authorization':'Bearer '+apikey},body:JSON.stringify(body),cache:'no-store'});let d={};try{d=await r.json()}catch(e){}return {r,d}}document.getElementById('send').onclick=async()=>{const identifier=document.getElementById('id').value.trim();if(!identifier)return show('Escribe tu usuario o correo.');show('Enviando…');try{const {r,d}=await call({action:'request',identifier});if(!r.ok||d.ok===false)return show((d&&d.error)||('Error '+r.status));show(d.message||'Código enviado al teléfono terminado en 9299.');document.getElementById('step2').classList.remove('hide')}catch(e){show('No se pudo conectar con el servicio de SMS.')}};document.getElementById('save').onclick=async()=>{const identifier=document.getElementById('id').value.trim(),code=document.getElementById('code').value.trim(),a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b)return show('Las contraseñas no coinciden.');try{const {r,d}=await call({action:'reset',identifier,code,password:a});if(!r.ok||d.ok===false)return show((d&&d.error)||('Error '+r.status));show(d.message||'Contraseña actualizada.')}catch(e){show('No se pudo conectar con el servicio.')}};</script></body></html>
