<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>NurseTrack Login</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:#397f88;color:#fff;font-size:25px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}.center{text-align:center}h1{margin:0 0 6px}.muted{color:#6f858b;font-size:13px;line-height:1.5}.contact{margin-top:8px;color:#557077;font-size:12px;line-height:1.45}.footer{margin-top:14px;color:#6f858b;font-size:11px;line-height:1.45}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;min-height:48px;border:1px solid #d8e6e8;border-radius:12px;padding:11px 12px;font-size:16px}.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:#397f88;color:#fff;font-weight:800;font-size:16px;margin-top:16px}.linkbtn{border:0;background:transparent;color:#397f88;font-weight:800;padding:12px 0;margin-top:4px;width:100%;font-size:14px}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f4f8f8;border:1px solid #dbe7e9;color:#557077;font-size:13px}.ok{background:#eef8f2;border-color:#bddfca;color:#2d6b45}.err{background:#fff1f0;border-color:#edc4c0;color:#8a3d36}.badge{display:inline-block;margin:12px 0;padding:7px 11px;border-radius:999px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:12px;font-weight:800}</style><script>(function(){var q=location.search||'',h=location.hash||'',all=(q+' '+h).toLowerCase();if(all.indexOf('type=recovery')>=0||all.indexOf('token_hash=')>=0||all.indexOf('access_token=')>=0&&all.indexOf('recovery')>=0){location.replace('reset-password.html'+q+h)}})();</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="card"><div class="center"><div class="logo" id="coverLogo">NT</div><h1 id="coverInstitution">NurseTrack Clinical</h1><div class="badge" id="coverVersion">v3.0 · CLOUD STABLE 24</div><div class="muted" id="coverSubtitle">Acceso seguro a la plataforma clínica</div><div class="contact" id="coverContact" style="display:none"></div></div><form id="loginForm"><div class="field"><label>Usuario / email</label><input id="email" type="email" autocomplete="username" autocapitalize="none" spellcheck="false" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit" id="loginBtn">Entrar</button><button class="linkbtn" type="button" id="forgotBtn">¿Olvidaste tu contraseña?</button></form><div id="status" class="status">Verificando sesión…</div><div class="footer" id="coverFooter" style="display:none"></div></div></div><script>(function(){const VERSION='20260831-stable24',COVER_KEY='nursetrack_v3_login_cover';const SUPABASE_URL='https://ummubyacvgdobgbwvwmf.supabase.co';const SUPABASE_KEY='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function applyCover(){var d={institution:'NurseTrack Clinical',subtitle:'Acceso seguro a la plataforma clínica',address:'',phone:'',email:'',footer:'',logoUrl:'',showContact:true,showVersion:true};try{Object.assign(d,JSON.parse(localStorage.getItem(COVER_KEY)||'{}'))}catch(e){}document.getElementById('coverInstitution').textContent=d.institution||'NurseTrack Clinical';document.getElementById('coverSubtitle').textContent=d.subtitle||'';var v=document.getElementById('coverVersion');v.style.display=d.showVersion===false?'none':'inline-block';var c=document.getElementById('coverContact'),parts=[];if(d.address)parts.push(esc(d.address));if(d.phone)parts.push(esc(d.phone));if(d.email)parts.push(esc(d.email));if(d.showContact!==false&&parts.length){c.innerHTML=parts.join('<br>');c.style.display='block'}else{c.style.display='none'}var f=document.getElementById('coverFooter');if(d.footer){f.textContent=d.footer;f.style.display='block'}else f.style.display='none';var l=document.getElementById('coverLogo');if(d.logoUrl){l.innerHTML='<img src="'+esc(d.logoUrl)+'" alt="Logo">'}else l.textContent='NT'}applyCover();window.addEventListener('storage',function(e){if(e.key===COVER_KEY)applyCover()});const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const status=document.getElementById('status'),email=document.getElementById('email'),password=document.getElementById('password'),loginBtn=document.getElementById('loginBtn');const returnEmergency=new URL(location.href).searchParams.get('return')==='emergency';const destination=returnEmergency?'admin-emergency.html?v='+VERSION:'cloud-preview.html?v='+VERSION;function setStatus(t,k){status.textContent=t;status.className='status'+(k?' '+k:'')}async function checkSession(){const r=await sb.auth.getSession();if(r.data&&r.data.session){setStatus(returnEmergency?'Sesión activa. Abriendo acceso de emergencia…':'Sesión activa. Abriendo NurseTrack…','ok');location.replace(destination);return}setStatus(returnEmergency?'Autenticación lista para acceso de emergencia.':'Autenticación lista.')}checkSession();if(new URL(location.href).searchParams.get('password')==='updated')setStatus('Contraseña actualizada. Ya puedes entrar.','ok');document.getElementById('loginForm').onsubmit=async function(e){e.preventDefault();loginBtn.disabled=true;setStatus('Verificando acceso…');const r=await sb.auth.signInWithPassword({email:email.value.trim().toLowerCase(),password:password.value});loginBtn.disabled=false;if(r.error){setStatus('No se pudo entrar: '+r.error.message,'err');return}setStatus(returnEmergency?'Acceso correcto. Abriendo panel de emergencia…':'Acceso correcto. Abriendo NurseTrack…','ok');location.replace(destination)};document.getElementById('forgotBtn').onclick=async function(){const value=email.value.trim().toLowerCase();if(!value){setStatus('Escribe primero tu email y vuelve a tocar “¿Olvidaste tu contraseña?”.','err');email.focus();return}setStatus('Enviando email de recuperación…');const redirectTo=new URL('reset-password.html?v='+VERSION,location.href).href;const r=await sb.auth.resetPasswordForEmail(value,{redirectTo});if(r.error){setStatus('No se pudo enviar el email: '+r.error.message,'err');return}setStatus('Email enviado. Abre el mensaje y toca el enlace para crear una nueva contraseña.','ok')};})();</script></body></html>
