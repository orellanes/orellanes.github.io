<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>NurseTrack Login</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:#397f88;color:#fff;font-size:25px;font-weight:900;overflow:hidden}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}.center{text-align:center}h1{margin:0 0 6px}.muted{color:#6f858b;font-size:13px;line-height:1.5}.contact{margin-top:8px;color:#557077;font-size:12px;line-height:1.45}.footer{margin-top:14px;color:#6f858b;font-size:11px;line-height:1.45}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;min-height:48px;border:1px solid #d8e6e8;border-radius:12px;padding:11px 12px;font-size:16px}.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:#397f88;color:#fff;font-weight:800;font-size:16px;margin-top:16px}.btn.secondary{background:#eef5f5;color:#315f67;border:1px solid #d4e4e6}.btn:disabled{opacity:.55}.linkbtn{border:0;background:transparent;color:#397f88;font-weight:800;padding:12px 0;margin-top:4px;width:100%;font-size:14px}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f4f8f8;border:1px solid #dbe7e9;color:#557077;font-size:13px}.ok{background:#eef8f2;border-color:#bddfca;color:#2d6b45}.err{background:#fff1f0;border-color:#edc4c0;color:#8a3d36}.badge{display:inline-block;margin:12px 0;padding:7px 11px;border-radius:999px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:12px;font-weight:800}.hidden{display:none!important}.recover{margin-top:14px;padding-top:14px;border-top:1px solid #dbe7e9}.recover h3{margin:0 0 6px}.choice{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choice .btn{margin-top:10px;min-height:46px;font-size:14px}@media(max-width:420px){.card{padding:22px}.choice{grid-template-columns:1fr}}</style><script>(function(){var q=location.search||'',h=location.hash||'',all=(q+' '+h).toLowerCase();if(all.indexOf('type=recovery')>=0||all.indexOf('token_hash=')>=0||all.indexOf('access_token=')>=0&&all.indexOf('recovery')>=0){location.replace('reset-password.html'+q+h)}})();</script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="card"><div class="center"><div class="logo" id="coverLogo">NT</div><h1 id="coverInstitution">NurseTrack Clinical</h1><div class="badge" id="coverVersion">v3.7 · CLOUD MINIMAL 25e · SAFE 37</div><div class="muted" id="coverSubtitle">Acceso seguro a la plataforma clínica</div><div class="contact" id="coverContact" style="display:none"></div></div><form id="loginForm"><div class="field"><label>Usuario o email</label><input id="email" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Ej. carlos" required></div><div class="field"><label>Contraseña / passcode</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit" id="loginBtn">Entrar</button><button class="linkbtn" type="button" id="forgotBtn">¿Olvidaste tu contraseña?</button></form><div id="recoverPanel" class="recover hidden"><h3>Recuperar contraseña</h3><div class="muted">Usa el mismo usuario o email escrito arriba. Puedes recibir un código por SMS o usar el email como alternativa.</div><div class="choice"><button type="button" class="btn" id="smsRequestBtn">📱 Enviar código por SMS</button><button type="button" class="btn secondary" id="emailRecoverBtn">✉️ Enviar por email</button></div><div id="smsResetFields" class="hidden"><div class="field"><label>Código de 6 dígitos</label><input id="smsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><div class="field"><label>Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8"></div><div class="field"><label>Confirmar nueva contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8"></div><button type="button" class="btn" id="smsResetBtn">Cambiar contraseña</button></div><button type="button" class="linkbtn" id="backLoginBtn">Volver al acceso</button></div><div id="status" class="status">Verificando sesión…</div><div class="footer" id="coverFooter" style="display:none"></div></div></div><script>(function(){const VERSION='20260902-safe37-minimal25e',COVER_KEY='nursetrack_v3_login_cover';const SUPABASE_URL='https://ummubyacvgdobgbwvwmf.supabase.co';const SUPABASE_KEY='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1';const LOGIN_URL=SUPABASE_URL+'/functions/v1/nursetrack-username-login';const SMS_URL=SUPABASE_URL+'/functions/v1/recover-by-sms';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]})}function puertoRicoNow(){try{return new Intl.DateTimeFormat('es-PR',{timeZone:'America/Puerto_Rico',year:'numeric',month:'2-digit',day:'2-digit',hour:'numeric',minute:'2-digit',second:'2-digit'}).format(new Date())+' AST'}catch(e){return new Date().toLocaleString()}}function applyCover(){var d={institution:'NurseTrack Clinical',subtitle:'Acceso seguro a la plataforma clínica',address:'',phone:'',email:'',footer:'',logoUrl:'',showContact:true,showVersion:true};try{Object.assign(d,JSON.parse(localStorage.getItem(COVER_KEY)||'{}'))}catch(e){}document.getElementById('coverInstitution').textContent=d.institution||'NurseTrack Clinical';document.getElementById('coverSubtitle').textContent=d.subtitle||'';var vv=document.getElementById('coverVersion');vv.style.display=d.showVersion===false?'none':'inline-block';var c=document.getElementById('coverContact'),parts=[];if(d.address)parts.push(esc(d.address));if(d.phone)parts.push(esc(d.phone));if(d.email)parts.push(esc(d.email));if(d.showContact!==false&&parts.length){c.innerHTML=parts.join('<br>');c.style.display='block'}else c.style.display='none';var f=document.getElementById('coverFooter');if(d.footer){f.textContent=d.footer;f.style.display='block'}else f.style.display='none';var l=document.getElementById('coverLogo');if(d.logoUrl){l.innerHTML='<img src="'+esc(d.logoUrl)+'" alt="Logo">'}else l.textContent='NT'}applyCover();window.addEventListener('storage',function(e){if(e.key===COVER_KEY)applyCover()});const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const status=document.getElementById('status'),email=document.getElementById('email'),password=document.getElementById('password'),loginBtn=document.getElementById('loginBtn'),loginForm=document.getElementById('loginForm'),recoverPanel=document.getElementById('recoverPanel'),smsFields=document.getElementById('smsResetFields');const returnEmergency=new URL(location.href).searchParams.get('return')==='emergency';const destination=returnEmergency?'admin-emergency.html?v='+VERSION:'cloud-preview.html?v='+VERSION;function setStatus(t,k){status.textContent=t;status.className='status'+(k?' '+k:'')}function identifier(){return email.value.trim().toLowerCase()}function needIdentifier(){if(identifier())return true;setStatus('Escribe primero tu usuario o email.','err');email.focus();return false}async function loginRequest(action,secret){var r=await fetch(LOGIN_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify({action:action,username:identifier(),password:secret||''})});var j={};try{j=await r.json()}catch(e){}if(!r.ok)throw new Error(j.error||'No se pudo completar la solicitud.');return j}async function smsRequest(payload){var r=await fetch(SMS_URL,{method:'POST',headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},body:JSON.stringify(Object.assign({identifier:identifier()},payload))});var j={};try{j=await r.json()}catch(e){}if(!r.ok||j.ok===false)throw new Error(j.error||'No se pudo completar la recuperación por SMS.');return j}async function checkSession(){const r=await sb.auth.getSession();if(r.data&&r.data.session){setStatus(returnEmergency?'Sesión activa. Abriendo acceso de emergencia…':'Sesión activa. Abriendo NurseTrack…','ok');location.replace(destination);return}setStatus(returnEmergency?'Autenticación lista para acceso de emergencia.':'Puedes entrar con tu usuario o con tu email.')}checkSession();if(new URL(location.href).searchParams.get('password')==='updated')setStatus('Contraseña actualizada. Ya puedes entrar.','ok');loginForm.onsubmit=async function(e){e.preventDefault();loginBtn.disabled=true;setStatus('Verificando acceso…');try{var j=await loginRequest('login',password.value);var s=await sb.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(s.error)throw s.error;setStatus(returnEmergency?'Acceso correcto. Abriendo panel de emergencia…':'Acceso correcto. Abriendo NurseTrack…','ok');location.replace(destination)}catch(err){setStatus('No se pudo entrar: '+(err&&err.message||'Usuario o contraseña incorrectos.'),'err')}finally{loginBtn.disabled=false}};document.getElementById('forgotBtn').onclick=function(){if(!needIdentifier())return;recoverPanel.classList.remove('hidden');password.disabled=true;loginBtn.disabled=true;setStatus('Selecciona cómo quieres recuperar tu contraseña.');};document.getElementById('backLoginBtn').onclick=function(){recoverPanel.classList.add('hidden');smsFields.classList.add('hidden');password.disabled=false;loginBtn.disabled=false;setStatus('Puedes entrar con tu usuario o con tu email.');};document.getElementById('smsRequestBtn').onclick=async function(){if(!needIdentifier())return;var b=this;b.disabled=true;setStatus('Solicitando código por SMS…');try{var j=await smsRequest({action:'request'});smsFields.classList.remove('hidden');document.getElementById('smsCode').focus();setStatus((j.message||'Código enviado por SMS.')+' Solicitud generada: '+puertoRicoNow()+'.','ok')}catch(err){setStatus('SMS: '+(err&&err.message||'No se pudo enviar el código.'),'err')}finally{b.disabled=false}};document.getElementById('emailRecoverBtn').onclick=async function(){if(!needIdentifier())return;var b=this;b.disabled=true;setStatus('Procesando recuperación por email…');try{await loginRequest('recover','');setStatus('Si la cuenta está activa, se envió un email de recuperación a la dirección registrada. Solicitud generada: '+puertoRicoNow()+'.','ok')}catch(err){setStatus('No se pudo procesar la recuperación por email. Inténtalo nuevamente.','err')}finally{b.disabled=false}};document.getElementById('smsResetBtn').onclick=async function(){if(!needIdentifier())return;var code=document.getElementById('smsCode').value.trim(),p1=document.getElementById('newPassword').value,p2=document.getElementById('confirmPassword').value;if(!/^\d{6}$/.test(code)){setStatus('Escribe el código de 6 dígitos.','err');return}if(p1.length<8){setStatus('La nueva contraseña debe tener al menos 8 caracteres.','err');return}if(p1!==p2){setStatus('Las contraseñas no coinciden.','err');return}var b=this;b.disabled=true;setStatus('Cambiando contraseña…');try{var j=await smsRequest({action:'reset',code:code,password:p1});document.getElementById('smsCode').value='';document.getElementById('newPassword').value='';document.getElementById('confirmPassword').value='';recoverPanel.classList.add('hidden');smsFields.classList.add('hidden');password.disabled=false;loginBtn.disabled=false;password.focus();setStatus(j.message||'Contraseña actualizada. Ya puedes entrar.','ok')}catch(err){setStatus('No se pudo cambiar la contraseña: '+(err&&err.message||'Código inválido.'),'err')}finally{b.disabled=false}};})();</script></body></html>
