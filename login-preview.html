<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NurseTrack Login Preview</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:#397f88;color:#fff;font-size:25px;font-weight:900}.center{text-align:center}h1{margin:0 0 6px}.muted{color:#6f858b;font-size:13px;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;min-height:48px;border:1px solid #d8e6e8;border-radius:12px;padding:11px 12px;font-size:16px}.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:#397f88;color:#fff;font-weight:800;font-size:16px;margin-top:16px}.secondary{background:#fff;color:#397f88;border:1.5px solid #83b7bd}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f4f8f8;border:1px solid #dbe7e9;color:#557077;font-size:13px}.badge{display:inline-block;margin:12px 0;padding:7px 11px;border-radius:999px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:12px;font-weight:800}</style></head><body><div class="wrap"><div class="card"><div class="center"><div class="logo">NT</div><h1>NurseTrack Clinical</h1><div class="badge">LOGIN REAL · PREPARADO</div><div class="muted">Pantalla de acceso preparada para Supabase Auth. La conexión se activará únicamente con configuración pública autorizada.</div></div><form id="loginForm"><div class="field"><label>Usuario / email</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Contraseña</label><input id="password" type="password" autocomplete="current-password" required></div><button class="btn" type="submit">Entrar</button><button class="btn secondary" type="button" id="openLocal">Abrir versión local protegida</button></form><div id="status" class="status">Conexión de autenticación: pendiente de activar.</div></div></div><script>(function(){document.getElementById('loginForm').onsubmit=function(e){e.preventDefault();document.getElementById('status').textContent='La interfaz de login está lista. La conexión con Supabase Auth aún no está publicada.'};document.getElementById('openLocal').onclick=function(){location.href='cloud-preview.html?v=20260830-cloudpreview1'};})();</script></body></html>
