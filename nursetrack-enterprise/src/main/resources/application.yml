spring:
  application:
    name: nursetrack-enterprise
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nursetrack}
    username: ${DATABASE_USER:nursetrack}
    password: ${DATABASE_PASSWORD:nursetrack}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
