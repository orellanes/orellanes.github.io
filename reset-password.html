<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NurseTrack · Restablecer contraseña</title>
<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef6f7;color:#15313b;margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(460px,100%);background:#fff;border:1px solid #dbe6ea;border-radius:22px;padding:26px;box-sizing:border-box;box-shadow:0 18px 55px rgba(18,57,70,.14)}h1{font-size:22px;margin:0 0 8px}.muted{color:#6b7d85;font-size:13px}.field{margin-top:14px}.field label{display:block;font-weight:800;font-size:13px;margin-bottom:6px}input{width:100%;box-sizing:border-box;border:1px solid #dbe6ea;border-radius:12px;padding:13px;font:inherit}.btn{width:100%;margin-top:16px;border:0;border-radius:12px;padding:13px;font-weight:800;background:#0f6175;color:#fff}.notice{margin-top:14px;padding:12px;border-radius:12px;background:#f7fbfc;border:1px solid #d9e7eb;font-size:12px}.ok{background:#f3fbf6;border-color:#c8e5d2;color:#22643a}.error{background:#fff5f5;border-color:#efcaca;color:#8a2d2d}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js?v=20260904-ui22"></script>
</head>
<body><main class="card"><h1>Restablecer contraseña</h1><div class="muted">Use el enlace recibido por correo para establecer una nueva contraseña segura.</div><div class="field"><label>Nueva contraseña</label><input id="p1" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><div class="field"><label>Confirmar contraseña</label><input id="p2" type="password" autocomplete="new-password" placeholder="Repita la contraseña"></div><button class="btn" id="save">Guardar nueva contraseña</button><div class="notice" id="status">Verificando enlace seguro…</div></main>
<script>
(async()=>{const cfg=window.NURSETRACK_SUPABASE||{},status=document.getElementById('status'),btn=document.getElementById('save');if(!cfg.url||!cfg.publishableKey){status.textContent='Configuración de nube no disponible.';status.className='notice error';btn.disabled=true;return}const client=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});let recovery=false;client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recovery=true;status.textContent='Enlace verificado. Escriba su nueva contraseña.';status.className='notice ok'}});const {data:{session}}=await client.auth.getSession();if(session){recovery=true;status.textContent='Sesión de recuperación lista.';status.className='notice ok'}btn.onclick=async()=>{const p1=document.getElementById('p1').value,p2=document.getElementById('p2').value;if(!recovery){status.textContent='El enlace no es válido o expiró. Solicite uno nuevo desde el inicio de sesión.';status.className='notice error';return}if(p1.length<8){status.textContent='La contraseña debe tener al menos 8 caracteres.';status.className='notice error';return}if(p1!==p2){status.textContent='Las contraseñas no coinciden.';status.className='notice error';return}btn.disabled=true;const {error}=await client.auth.updateUser({password:p1});if(error){status.textContent=error.message||'No se pudo actualizar la contraseña.';status.className='notice error';btn.disabled=false;return}await client.auth.signOut({scope:'local'});status.textContent='✓ Contraseña actualizada. Regresando al inicio de sesión…';status.className='notice ok';setTimeout(()=>location.replace('/cloud-login-custom.html?v=20260904-ui22'),1200)}})();
</script></body></html>
