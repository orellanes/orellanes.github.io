<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>NurseTrack · Recuperar contraseña</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(440px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:0 auto 14px;background:#397f88;color:#fff;font-size:25px;font-weight:900}.center{text-align:center}h1{margin:0 0 6px}.muted{color:#6f858b;font-size:13px;line-height:1.5}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}.field input{width:100%;min-height:48px;border:1px solid #d8e6e8;border-radius:12px;padding:11px 12px;font-size:16px}.btn{width:100%;min-height:50px;border:0;border-radius:12px;background:#397f88;color:#fff;font-weight:800;font-size:16px;margin-top:16px}.secondary{background:#fff;color:#397f88;border:1.5px solid #83b7bd}.status{margin-top:14px;padding:11px 12px;border-radius:12px;background:#f4f8f8;border:1px solid #dbe7e9;color:#557077;font-size:13px}.ok{background:#eef8f2;border-color:#bddfca;color:#2d6b45}.err{background:#fff1f0;border-color:#edc4c0;color:#8a3d36}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><div class="wrap"><div class="card"><div class="center"><div class="logo">NT</div><h1>Crear nueva contraseña</h1><div class="muted">Abre esta página únicamente desde el enlace de recuperación recibido por email.</div></div><form id="resetForm"><div class="field"><label>Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required></div><div class="field"><label>Confirmar nueva contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn" id="saveBtn" type="submit">Guardar nueva contraseña</button><button class="btn secondary" type="button" id="backLogin">Volver al login</button></form><div id="status" class="status">Verificando el enlace seguro…</div></div></div><script>(function(){const SUPABASE_URL='https://ummubyacvgdobgbwvwmf.supabase.co',SUPABASE_KEY='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1',VERSION='20260831-stable23';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{detectSessionInUrl:true,persistSession:true,autoRefreshToken:true}}),status=document.getElementById('status'),form=document.getElementById('resetForm'),btn=document.getElementById('saveBtn');let ready=false;function setStatus(t,k){status.textContent=t;status.className='status'+(k?' '+k:'')}async function verifyLink(){try{const u=new URL(location.href),tokenHash=u.searchParams.get('token_hash'),type=u.searchParams.get('type');if(tokenHash&&type==='recovery'){const r=await sb.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});if(r.error)throw r.error}const s=await sb.auth.getSession();if(s.data&&s.data.session){ready=true;setStatus('Enlace verificado. Escribe tu nueva contraseña.','ok');return}setTimeout(async()=>{const s2=await sb.auth.getSession();if(s2.data&&s2.data.session){ready=true;setStatus('Enlace verificado. Escribe tu nueva contraseña.','ok')}else setStatus('El enlace expiró, ya fue utilizado o no es válido. Solicita un nuevo email de recuperación.','err')},900)}catch(e){setStatus('No se pudo validar el enlace: '+(e.message||'Error de recuperación'),'err')}}sb.auth.onAuthStateChange((event,session)=>{if(event==='PASSWORD_RECOVERY'||session){ready=true;setStatus('Enlace verificado. Escribe tu nueva contraseña.','ok')}});form.addEventListener('submit',async e=>{e.preventDefault();const p=document.getElementById('newPassword').value,c=document.getElementById('confirmPassword').value;if(p.length<8){setStatus('La contraseña debe tener al menos 8 caracteres.','err');return}if(p!==c){setStatus('Las contraseñas no coinciden.','err');return}if(!ready){setStatus('Primero debe validarse el enlace recibido por email.','err');return}btn.disabled=true;setStatus('Actualizando contraseña…');const r=await sb.auth.updateUser({password:p});btn.disabled=false;if(r.error){setStatus('No se pudo actualizar: '+r.error.message,'err');return}setStatus('Contraseña actualizada correctamente. Ya puedes entrar a NurseTrack.','ok');setTimeout(()=>location.replace('login-preview.html?v='+VERSION+'&password=updated'),900)});document.getElementById('backLogin').onclick=()=>location.href='login-preview.html?v='+VERSION;verifyLink()})();</script></body></html>
