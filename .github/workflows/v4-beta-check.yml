name: NurseTrack v4 Beta Check

on:
  push:
    branches: [nursetrack-v4-beta]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          set -euo pipefail
          find v4-beta -maxdepth 1 -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
      - name: Check inline index JavaScript
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,sys
          html=pathlib.Path('v4-beta/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',html,re.S|re.I)
          if not scripts:
              print('No inline script found')
              sys.exit(1)
          for i,script in enumerate(scripts):
              pathlib.Path(f'/tmp/v4-inline-{i}.js').write_text(script,encoding='utf-8')
          print('Inline scripts:',len(scripts))
          PY
          for f in /tmp/v4-inline-*.js; do node --check "$f"; done
      - name: Verify login contract
        run: |
          set -euo pipefail
          grep -Fq "action:'login',username:u,password:p" v4-beta/index.html
          ! grep -Fq "JSON.stringify({login:u,password:p})" v4-beta/index.html
          grep -Fq "nursetrack-username-login" v4-beta/index.html
      - name: Verify loader files exist
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib,re,sys
          text=pathlib.Path('supabase-config.js').read_text(encoding='utf-8')
          refs=re.findall(r"'([^']+\.js)\?v=", text)
          missing=[x for x in refs if not pathlib.Path('v4-beta',x).exists()]
          print('Loader JS:', len(refs))
          if missing:
              print('Missing:', *missing, sep='\n- ')
              sys.exit(1)
          PY
      - name: Verify clean v4 architecture
        run: |
          set -euo pipefail
          ! grep -qi '<iframe' v4-beta/index.html
          ! grep -q 'device-compat-runtime.js' v4-beta/index.html
          ! grep -q 'safe6-isolation.js' v4-beta/index.html
          grep -q 'NurseTrack Clinical v4 Beta' v4-beta/index.html
      - name: Browser cursor and focus smoke test
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0 >/dev/null 2>&1
          npx playwright install chromium >/dev/null
          python3 -m http.server 4173 >/tmp/nt-v4-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 1
          node <<'NODE'
          const { chromium } = require('playwright');
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1280,height:800}});
            const pageErrors=[];
            page.on('pageerror',e=>pageErrors.push(String(e)));
            await page.goto('http://127.0.0.1:4173/v4-beta/',{waitUntil:'domcontentloaded'});
            const user=page.locator('#loginName');
            const pass=page.locator('#loginPass');
            await user.waitFor({state:'visible'});
            const userBox=await user.boundingBox();
            if(!userBox) throw new Error('Username input has no clickable box');
            const hit=await page.evaluate(({x,y})=>{
              const el=document.elementFromPoint(x,y);
              return {id:el?.id||'',tag:el?.tagName||'',pe:getComputedStyle(el).pointerEvents};
            },{x:userBox.x+userBox.width/2,y:userBox.y+userBox.height/2});
            if(hit.id!=='loginName') throw new Error('Username input is covered by '+JSON.stringify(hit));
            await user.click();
            await user.fill('cursor-test');
            if(await user.inputValue()!=='cursor-test') throw new Error('Username input did not accept text');
            if(await page.evaluate(()=>document.activeElement?.id)!=='loginName') throw new Error('Username input did not keep focus');
            const cursor=await user.evaluate(el=>getComputedStyle(el).cursor);
            const pe=await user.evaluate(el=>getComputedStyle(el).pointerEvents);
            if(pe==='none') throw new Error('Username input pointer-events is none');
            if(cursor!=='text') throw new Error('Username cursor is not text: '+cursor);
            await pass.click();
            await pass.fill('12345678');
            if(await pass.inputValue()!=='12345678') throw new Error('Password input did not accept text');
            if(await page.evaluate(()=>document.activeElement?.id)!=='loginPass') throw new Error('Password input did not keep focus');
            if(pageErrors.length) throw new Error('Page errors: '+pageErrors.join(' | '));
            console.log('V4 browser cursor/focus smoke passed');
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
      - name: Summary
        run: echo 'NurseTrack v4 beta integrity and browser interaction checks passed.'
