<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#397f88">
<title>NurseTrack · Acceso seguro</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(420px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:22px;padding:26px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.center{text-align:center}.logo{width:72px;height:72px;border-radius:18px;background:#397f88;color:#fff;display:grid;place-items:center;margin:auto;font-weight:900;font-size:24px;overflow:hidden}.badge{display:inline-block;margin:12px 0;padding:7px 11px;border-radius:999px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:12px;font-weight:800}.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:5px}.field input{width:100%;min-height:48px;border:1px solid #d8e6e8;border-radius:11px;padding:11px 12px;font-size:16px;pointer-events:auto!important;cursor:text!important;caret-color:auto!important}.btn{width:100%;min-height:50px;border:0;border-radius:11px;background:#397f88;color:#fff;font-weight:800;font-size:16px;margin-top:15px;cursor:pointer}.btn:disabled{opacity:.55}.btn.link{min-height:auto;background:transparent;color:#397f88;margin-top:8px;padding:9px 8px}.btn.secondary{background:#fff;color:#397f88;border:1.5px solid #83b7bd}.status{margin-top:13px;padding:10px 12px;border-radius:10px;background:#f4f8f8;border:1px solid #dbe7e9;color:#557077;font-size:13px;line-height:1.45}.ok{background:#eef8f2;color:#2d6b45}.err{background:#fff1f0;color:#8a3d36}.hidden{display:none}.muted{color:#6f858b;font-size:13px;line-height:1.5}.divider{height:1px;background:#e4edef;margin:18px 0}
</style>
<script src="safe6-supabase-loader.js?v=20260908-canonical-nav166"></script>
</head>
<body>
<div class="wrap"><div class="card">
<div class="center"><div class="logo" id="loginLogo">NT</div><h1 id="loginInstitution">NurseTrack Clinical</h1><div class="muted" id="loginSubtitle">Acceso seguro a la plataforma clínica</div><div class="badge">v3.8 · BUILD 166</div></div>
<section id="loginView">
<form id="form"><div class="field"><label>Usuario o email</label><input id="user" autocomplete="username" autocapitalize="none" required></div><div class="field"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password" required></div><button class="btn" id="btn" type="submit">Entrar</button></form>
<button class="btn link" id="forgotBtn" type="button">¿Olvidó su contraseña?</button>
<div id="status" class="status">Preparando acceso seguro…</div>
</section>
<section id="recoveryView" class="hidden"><div class="divider"></div><h2>Recuperar contraseña</h2><div class="field"><label>Usuario o email</label><input id="recoveryIdentifier" autocomplete="username" autocapitalize="none"></div><button class="btn" id="smsBtn" type="button">Enviar código por SMS</button><button class="btn secondary" id="emailBtn" type="button">Enviar enlace por email</button><button class="btn link" id="backBtn" type="button">Volver</button><div id="recoveryStatus" class="status">Seleccione un método de recuperación.</div></section>
</div></div>
<script>
(function(){'use strict';
const BUILD='20260908-canonical-nav166';
const URL='https://ummubyacvgdobgbwvwmf.supabase.co';
const KEY='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1';
const LOGIN=URL+'/functions/v1/nursetrack-username-login';
const RECOVERY=URL+'/functions/v1/recover-by-sms';
const status=document.getElementById('status'),btn=document.getElementById('btn'),loginView=document.getElementById('loginView'),recoveryView=document.getElementById('recoveryView'),recoveryStatus=document.getElementById('recoveryStatus');
let sb=null;
function set(el,text,kind){el.textContent=text;el.className='status'+(kind?' '+kind:'')}
function showRecovery(on){loginView.classList.toggle('hidden',on);recoveryView.classList.toggle('hidden',!on)}
function loadCover(){try{const v=JSON.parse(localStorage.getItem('nursetrack_v3_login_cover')||'{}');if(v.institution)document.getElementById('loginInstitution').textContent=v.institution;if(v.subtitle)document.getElementById('loginSubtitle').textContent=v.subtitle;if(v.initials)document.getElementById('loginLogo').textContent=String(v.initials).replace(/[<>]/g,'').slice(0,4)||'NT'}catch(_){}}
loadCover();
async function getClient(){if(sb)return sb;if(typeof window.NT_loadSupabase!=='function')throw new Error('No se cargó el iniciador de acceso.');const lib=await window.NT_loadSupabase();sb=lib.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});return sb}
async function callJson(url,payload,timeoutMs){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeoutMs||12000);try{const r=await fetch(url,{method:'POST',mode:'cors',cache:'no-store',signal:controller.signal,headers:{'Content-Type':'application/json','apikey':KEY},body:JSON.stringify(payload)});let j={};try{j=await r.json()}catch(_){}if(!r.ok||j.ok===false)throw new Error(j.error||j.message||('Error '+r.status));return j}finally{clearTimeout(timer)}}
function openLatest(){location.replace('app-safe6.html?v='+encodeURIComponent(BUILD)+'&r='+Date.now())}
async function boot(){try{const c=await getClient();const r=await Promise.race([c.auth.getSession(),new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),6500))]);if(r&&r.data&&r.data.session){set(status,'Sesión encontrada. Abriendo NurseTrack…','ok');return openLatest()}set(status,'Escriba su usuario y contraseña.')}catch(e){set(status,'El acceso está disponible, pero no se pudo cargar el motor de sesión. Pulse Entrar para reintentar.','err')}}
boot();
document.getElementById('form').addEventListener('submit',async function(e){e.preventDefault();btn.disabled=true;set(status,'Verificando acceso…');try{const username=document.getElementById('user').value.trim().toLowerCase(),password=document.getElementById('pass').value;if(!username||!password)throw new Error('Complete usuario y contraseña.');const j=await callJson(LOGIN,{action:'login',username,password},12000);const c=await getClient();const s=await c.auth.setSession({access_token:j.access_token,refresh_token:j.refresh_token});if(s.error)throw s.error;set(status,'Acceso correcto. Abriendo NurseTrack…','ok');openLatest()}catch(err){const m=err&&err.name==='AbortError'?'El servidor de acceso no respondió.':(err&&err.message||'No se pudo entrar.');set(status,'No se pudo entrar: '+m,'err')}finally{btn.disabled=false}});
document.getElementById('forgotBtn').onclick=function(){document.getElementById('recoveryIdentifier').value=document.getElementById('user').value.trim();showRecovery(true)};
document.getElementById('backBtn').onclick=function(){showRecovery(false)};
document.getElementById('smsBtn').onclick=async function(){const id=document.getElementById('recoveryIdentifier').value.trim().toLowerCase();if(!id)return set(recoveryStatus,'Escriba su usuario o email.','err');this.disabled=true;set(recoveryStatus,'Solicitando código…');try{const j=await callJson(RECOVERY,{action:'request',identifier:id},15000);set(recoveryStatus,j.message||'Solicitud procesada.','ok')}catch(e){set(recoveryStatus,e.message||'No se pudo enviar el código.','err')}finally{this.disabled=false}};
document.getElementById('emailBtn').onclick=async function(){const id=document.getElementById('recoveryIdentifier').value.trim().toLowerCase();if(!id)return set(recoveryStatus,'Escriba su usuario o email.','err');this.disabled=true;set(recoveryStatus,'Solicitando enlace…');try{await callJson(LOGIN,{action:'recover',username:id},15000);set(recoveryStatus,'Si la cuenta existe, se procesó el enlace de recuperación.','ok')}catch(e){set(recoveryStatus,e.message||'No se pudo solicitar el enlace.','err')}finally{this.disabled=false}};
})();
</script>
</body></html>
