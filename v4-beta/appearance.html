<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b63a8">
<title>NurseTrack One · Apariencia y Portadas</title>
<style>
:root{--bg:#f4f8f8;--panel:#fff;--text:#17343c;--muted:#6f858b;--line:#d8e6e8;--brand:#0b63a8;--accent:#397f88;--danger:#9a3434}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:18px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#12a7b5,#0b668d);color:#fff;font-weight:900}.brand h1{font-size:22px;margin:0;color:#164a7a}.brand small{color:var(--muted)}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 5px 18px rgba(25,67,88,.05);margin-top:14px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}label{display:block;font-weight:750;margin:8px 0 6px}input,select,textarea{width:100%;padding:11px 12px;border:1px solid #c7d9dd;border-radius:11px;background:#fff;color:var(--text);font:inherit}textarea{min-height:92px;resize:vertical}input[type=color]{height:46px;padding:4px}.colorrow{display:grid;grid-template-columns:80px 1fr;gap:9px;align-items:end}.sectiontitle{grid-column:1/-1;margin-top:10px;padding-top:12px;border-top:1px solid var(--line);font-size:16px;font-weight:850;color:#164a7a}.hint{font-size:12px;color:var(--muted);margin-top:5px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px}.btn{border:0;border-radius:11px;padding:11px 15px;background:var(--brand);color:#fff;font-weight:800;cursor:pointer;text-decoration:none;display:inline-block}.btn.secondary{background:var(--accent)}.btn.light{background:#edf5f6;color:var(--text);border:1px solid var(--line)}.status{min-height:22px;margin-top:11px;color:var(--muted)}.status.error{color:var(--danger)}.status.ok{color:#216b48}.previewgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.preview{min-height:250px;border:1px solid var(--line);border-radius:16px;background-size:cover;background-position:center;overflow:hidden;padding:16px}.loginpreview{display:grid;place-items:center}.previewbox{background:rgba(255,255,255,.93);border-radius:15px;padding:18px;text-align:center;min-width:min(390px,92%)}.previewmark{width:52px;height:52px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;color:#fff;font-weight:900;background:var(--brand);background-size:cover;background-position:center}.apppreview{background:#f8fbfc;display:grid;grid-template-columns:34% 1fr;gap:10px}.sideprev,.mainprev{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px}.sideprev strong{display:block}.sideprev small{display:block;color:var(--muted);margin-top:4px}.headerprev{padding:10px;border:1px solid var(--line);border-radius:10px;background:#edf5f6;white-space:pre-wrap}.login{max-width:430px;margin:10vh auto}.notice{padding:12px 14px;border-radius:12px;background:#edf5f6;color:#31545b}.hidden{display:none!important}@media(max-width:760px){.grid,.previewgrid{grid-template-columns:1fr}.full,.sectiontitle{grid-column:auto}.top{align-items:flex-start;flex-direction:column}.wrap{padding:14px}.apppreview{grid-template-columns:1fr}}
</style>
<script src="../safe6-supabase-loader.js?v=20260909-appearance-panel-1"></script>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="brand"><div class="mark">NT</div><div><h1>NurseTrack One</h1><small>Apariencia / Portadas</small></div></div><a class="btn light" href="index.html?v=20260909-appearance-panel-1">← Volver al sistema</a></div>
  <section id="loginCard" class="card login hidden"><h2>Acceso de Súper Administrador</h2><p class="notice">Esta pantalla usa la misma cuenta de NurseTrack One.</p><form id="loginForm"><label>Usuario</label><input id="loginName" autocomplete="username" required><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password" required><button class="btn" style="width:100%;margin-top:15px" type="submit">Entrar</button><div id="loginStatus" class="status"></div></form></section>
  <section id="appearanceCard" class="card hidden"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h2 style="margin:0">🎨 Apariencia y Portadas</h2><p style="margin:5px 0 0;color:var(--muted)">Edita portada, panel izquierdo y encabezado superior.</p></div><span class="notice">Súper Administrador</span></div><div id="formArea" style="margin-top:14px"></div><div id="saveStatus" class="status"></div></section>
</div>
<script>
(async function(){
'use strict';
const $=id=>document.getElementById(id),cfg={url:'https://ummubyacvgdobgbwvwmf.supabase.co',publishableKey:'sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1'};
let sb=null,user=null,company=null,current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function status(id,text,type=''){const el=$(id);if(!el)return;el.textContent=text||'';el.className='status'+(type?' '+type:'')}
function defaults(){return{primary_color:'#0b63a8',secondary_color:'#397f88',background_color:'#f4f8f8',text_color:'#17343c',login_cover_url:'',internal_cover_url:'',font_family:'system',font_scale:'1',login_title:'NurseTrack One',login_subtitle:'Sistema Clínico y Administrativo',sidebar_title:'NurseTrack One',sidebar_subtitle:'Sistema Clínico y Administrativo',top_banner_text:''}}
function norm(v){return Object.assign(defaults(),v||{})}
async function client(){if(sb)return sb;if(typeof NT_loadSupabase!=='function')throw new Error('No se pudo cargar el acceso cloud.');const lib=await NT_loadSupabase();sb=lib.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}});return sb}
async function context(){await client();const ses=await sb.auth.getSession();user=ses?.data?.session?.user||null;if(!user)return false;const p=await sb.from('nursetrack_profiles').select('role').eq('user_id',user.id).maybeSingle();if(!['superadmin','superadministrator'].includes(String(p.data?.role||'').toLowerCase()))throw new Error('Acceso restringido al Súper Administrador.');let r=await sb.from('nursetrack_company_users').select('company_id').eq('user_id',user.id).eq('active',true).limit(1);company=r.data?.[0]?.company_id||null;if(!company){const m=await sb.from('nursetrack_account_memberships').select('company_id').eq('user_id',user.id).eq('status','active').limit(1);company=m.data?.[0]?.company_id||null}if(!company)throw new Error('No hay compañía activa.');return true}
async function load(){const r=await sb.from('nursetrack_company_settings').select('*').eq('company_id',company).maybeSingle();if(r.error)throw r.error;current=r.data||{company_id:company,settings:{}};current.settings=current.settings||{};current.branding=norm(current.settings.branding);return current}
function values(){return{primary_color:$('primaryColor').value,secondary_color:$('secondaryColor').value,background_color:$('backgroundColor').value,text_color:$('textColor').value,login_cover_url:$('loginCover').value.trim(),internal_cover_url:$('internalCover').value.trim(),font_family:$('fontFamily').value,font_scale:$('fontScale').value,login_title:$('loginTitle').value.trim(),login_subtitle:$('loginSubtitle').value.trim(),sidebar_title:$('sidebarTitle').value.trim(),sidebar_subtitle:$('sidebarSubtitle').value.trim(),top_banner_text:$('topBanner').value.trim()}}
function render(x){const b=x.branding;$('formArea').innerHTML=`<div class="grid">
<div class="sectiontitle">Identidad visual</div>
<div><label>Nombre mostrado del sistema</label><input id="displayName" value="${esc(x.display_name_override||'')}"></div><div><label>Logo (URL de imagen)</label><input id="logoUrl" value="${esc(x.logo_url||'')}" placeholder="https://..."></div><div><label>Marca de agua</label><input id="watermark" value="${esc(x.watermark_text||'')}"></div><div><label>Tipografía</label><select id="fontFamily"><option value="system" ${b.font_family==='system'?'selected':''}>Sistema</option><option value="arial" ${b.font_family==='arial'?'selected':''}>Arial</option><option value="georgia" ${b.font_family==='georgia'?'selected':''}>Georgia</option><option value="trebuchet" ${b.font_family==='trebuchet'?'selected':''}>Trebuchet</option></select></div><div><label>Tamaño general</label><select id="fontScale"><option value="0.9" ${b.font_scale==='0.9'?'selected':''}>Pequeño</option><option value="1" ${b.font_scale==='1'?'selected':''}>Normal</option><option value="1.1" ${b.font_scale==='1.1'?'selected':''}>Grande</option><option value="1.2" ${b.font_scale==='1.2'?'selected':''}>Extra grande</option></select></div><div></div>
<div class="colorrow"><input id="primaryColor" type="color" value="${esc(b.primary_color)}"><div><label>Color principal</label><input value="${esc(b.primary_color)}" readonly></div></div><div class="colorrow"><input id="secondaryColor" type="color" value="${esc(b.secondary_color)}"><div><label>Color secundario</label><input value="${esc(b.secondary_color)}" readonly></div></div><div class="colorrow"><input id="backgroundColor" type="color" value="${esc(b.background_color)}"><div><label>Fondo</label><input value="${esc(b.background_color)}" readonly></div></div><div class="colorrow"><input id="textColor" type="color" value="${esc(b.text_color)}"><div><label>Texto</label><input value="${esc(b.text_color)}" readonly></div></div>
<div class="sectiontitle">Portada principal de acceso</div>
<div class="full"><label>Imagen de portada (URL)</label><input id="loginCover" value="${esc(b.login_cover_url)}" placeholder="https://..."></div><div class="full"><label>Título de la portada</label><input id="loginTitle" value="${esc(b.login_title)}"></div><div class="full"><label>Subtítulo / texto de la portada</label><input id="loginSubtitle" value="${esc(b.login_subtitle)}"></div>
<div class="sectiontitle">Panel izquierdo y encabezado</div>
<div><label>Título del panel izquierdo</label><input id="sidebarTitle" value="${esc(b.sidebar_title)}" placeholder="Ej. NurseTrack One"><div class="hint">Aparece arriba del menú izquierdo.</div></div><div><label>Subtítulo del panel izquierdo</label><input id="sidebarSubtitle" value="${esc(b.sidebar_subtitle)}" placeholder="Ej. Sistema Clínico y Administrativo"></div><div class="full"><label>Texto superior al entrar al sistema</label><textarea id="topBanner" placeholder="Ej. Usuarios adscritos al sistema: ...">${esc(b.top_banner_text)}</textarea><div class="hint">Puedes escribir nombres de usuarios, departamentos, instrucciones o cualquier identificación.</div></div><div class="full"><label>Fondo interno (URL de imagen)</label><input id="internalCover" value="${esc(b.internal_cover_url)}" placeholder="https://..."></div>
<div class="sectiontitle">Vista previa</div><div class="full previewgrid"><div id="loginPreview" class="preview loginpreview"></div><div id="appPreview" class="preview apppreview"></div></div>
</div><div class="actions"><button class="btn secondary" id="previewBtn">Vista previa</button><button class="btn" id="saveBtn">Guardar cambios</button><a class="btn light" href="index.html?v=20260909-appearance-panel-1">← Volver</a></div>`;
['primaryColor','secondaryColor','backgroundColor','textColor','displayName','logoUrl','loginCover','loginTitle','loginSubtitle','sidebarTitle','sidebarSubtitle','topBanner','internalCover','fontFamily','fontScale'].forEach(id=>$(id)?.addEventListener('input',preview));$('previewBtn').onclick=preview;$('saveBtn').onclick=save;preview()}
function preview(){const b=values(),logo=$('logoUrl').value.trim(),mark=logo?'':'NT',lp=$('loginPreview'),ap=$('appPreview');lp.style.backgroundColor=b.background_color;lp.style.backgroundImage=b.login_cover_url?`url("${b.login_cover_url.replace(/"/g,'')}")`:'';lp.innerHTML=`<div class="previewbox" style="color:${esc(b.text_color)}"><div class="previewmark" style="background-color:${esc(b.primary_color)};${logo?`background-image:url('${esc(logo)}')`:''}">${mark}</div><strong style="font-size:21px">${esc(b.login_title||'NurseTrack One')}</strong><div style="margin-top:5px">${esc(b.login_subtitle||'')}</div><div style="margin-top:10px"><span class="btn secondary" style="background:${esc(b.secondary_color)}">Entrar</span></div></div>`;ap.style.backgroundColor=b.background_color;ap.style.backgroundImage=b.internal_cover_url?`url("${b.internal_cover_url.replace(/"/g,'')}")`:'';ap.innerHTML=`<div class="sideprev"><strong>${esc(b.sidebar_title||'NurseTrack One')}</strong><small>${esc(b.sidebar_subtitle||'')}</small><hr style="border:0;border-top:1px solid #d8e6e8;margin:12px 0"><small>Expediente</small><small>Enfermería</small><small>Trabajo Social</small><small>Administración</small></div><div class="mainprev"><div class="headerprev">${esc(b.top_banner_text||'Texto superior / usuarios adscritos')}</div><div style="margin-top:12px;color:${esc(b.text_color)}"><strong>Panel principal</strong></div></div>`}
async function save(){try{status('saveStatus','Guardando apariencia…');const b=values(),settings=Object.assign({},current?.settings||{},{branding:b});const row={company_id:company,display_name_override:$('displayName').value.trim()||null,logo_url:$('logoUrl').value.trim()||null,watermark_text:$('watermark').value.trim()||null,settings,updated_by:user.id,updated_at:new Date().toISOString()};const r=await sb.from('nursetrack_company_settings').upsert(row,{onConflict:'company_id'});if(r.error)throw r.error;current=Object.assign({},current||{},row,{branding:b});status('saveStatus','Panel izquierdo, encabezado, portada y apariencia guardados correctamente.','ok')}catch(e){status('saveStatus',e.message||String(e),'error')}}
async function show(){try{if(!await context()){showLogin();return}const x=await load();$('loginCard').classList.add('hidden');$('appearanceCard').classList.remove('hidden');render(x)}catch(e){$('appearanceCard').classList.remove('hidden');$('formArea').innerHTML=`<div class="notice" style="color:#933">${esc(e.message||e)}</div>`}}
function showLogin(){$('appearanceCard').classList.add('hidden');$('loginCard').classList.remove('hidden')}
$('loginForm').onsubmit=async e=>{e.preventDefault();try{status('loginStatus','Verificando acceso…');await client();const username=$('loginName').value.trim(),password=$('loginPass').value;if(!username||!password)throw new Error('Completa usuario y contraseña.');const r=await fetch(cfg.url+'/functions/v1/nursetrack-username-login',{method:'POST',headers:{'Content-Type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify({action:'login',username,password})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token||!d.refresh_token)throw new Error(d.error||'Usuario o contraseña incorrectos.');const s=await sb.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(s.error)throw s.error;await show()}catch(e){status('loginStatus',e.message||String(e),'error')}};
try{await client();await show()}catch(e){showLogin();status('loginStatus',e.message||String(e),'error')}
})();
</script>
</body>
</html>
