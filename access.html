<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NurseTrack Clinical</title>
<style>
body{font-family:Arial,sans-serif;background:#eef8f7;margin:0;padding:40px 20px;color:#23464f}
main{max-width:420px;margin:auto;background:white;padding:24px;border-radius:16px;border:1px solid #cfe4e2}
h1{font-size:26px;margin:0 0 6px;color:#0d4c61}p{margin:0 0 18px;color:#657c83}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;height:48px;font-size:18px;padding:0 12px;border:1px solid #9fb8bb;border-radius:10px;background:white;color:#111}button{width:100%;height:48px;margin-top:18px;font-size:17px;border:0;border-radius:10px;background:#178f9a;color:white;font-weight:700;cursor:pointer}#msg{margin-top:12px;font-size:14px;color:#7c6a2f}#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#fff}
</style>
</head>
<body>
<main id="loginBox">
<h1>NurseTrack Clinical</h1>
<p>Acceso seguro</p>
<label for="user">Usuario</label>
<input id="user" name="user" type="text" autocomplete="username">
<label for="pass">Passcode</label>
<input id="pass" name="pass" type="password" autocomplete="current-password">
<button id="enter" type="button">Entrar</button>
<div id="msg"></div>
</main>
<iframe id="appFrame" src="index%20(3).html?v=304"></iframe>
<script>
(function(){
var AUTH='nursetrack_clinical_auth_v21';
var box=document.getElementById('loginBox'),frame=document.getElementById('appFrame'),user=document.getElementById('user'),pass=document.getElementById('pass'),msg=document.getElementById('msg'),ready=false;
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
frame.addEventListener('load',function(){ready=true;try{var d=doc();[['ntAdminCenterLoader','admin-center.js?v=293'],['ntTemplateDesignLoader','template-design.js?v=294'],['ntVisitAgendaLoader','visit-agenda.js?v=304'],['ntClinicalSafetyLoader','clinical-safety.js?v=296'],['ntProviderHandoffLoader','provider-handoff.js?v=297'],['ntPatientAppointmentLoader','patient-appointment.js?v=303'],['ntModuleSyncLoader','module-sync.js?v=304']].forEach(function(a){if(!d.getElementById(a[0])){var s=d.createElement('script');s.id=a[0];s.src=a[1];d.head.appendChild(s)}})}catch(e){}});
function alias(u){var l=u.toLowerCase();if(l!=='admin'&&l!=='administrador')return u;try{var a=JSON.parse(localStorage.getItem(AUTH)||'null');return a&&a.name?a.name:u}catch(e){return u}}
function go(){var u=user.value.trim(),p=pass.value;if(!u||!p){msg.textContent='Escriba usuario y passcode.';return}if(!ready||!doc()){msg.textContent='NurseTrack todavía está cargando. Intente otra vez en unos segundos.';return}var d=doc(),iu=d.getElementById('loginName'),ip=d.getElementById('loginPin'),b=d.getElementById('loginBtn');if(!iu||!ip||!b){msg.textContent='No se pudo abrir el acceso de NurseTrack.';return}iu.value=alias(u);ip.value=p;b.click();setTimeout(function(){var a=d.getElementById('appScreen');if(a&&!a.classList.contains('hidden')){box.style.display='none';frame.style.display='block';msg.textContent=''}else{msg.textContent='Usuario o passcode no válido.'}},300)}
document.getElementById('enter').addEventListener('click',go);pass.addEventListener('keydown',function(e){if(e.key==='Enter')go()});
})();
</script>
</body>
</html>
