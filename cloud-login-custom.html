<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NurseTrack Clinical</title><style>:root{--primary:#0f6175;--bg:#eef6f7;--text:#15313b;--muted:#6b7d85;--line:#dbe6ea;--soft:#e9f4f6}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--text)}body{background:linear-gradient(180deg,var(--bg),#f8fbfc)}.wrap{min-height:100vh;display:grid;place-items:center;padding:22px}.card{width:min(470px,100%);background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px;box-shadow:0 18px 55px rgba(18,57,70,.14)}.brand{display:flex;align-items:center;gap:13px;margin-bottom:22px}.logo{width:54px;height:54px;border-radius:16px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900;font-size:20px}.brand h1{margin:0;font-size:23px}.brand p{margin:4px 0 0;color:var(--muted);font-size:13px}.badge{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border-radius:999px;background:var(--soft);color:var(--primary);font-size:12px;font-weight:800;margin-bottom:16px}.dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}.field{margin-top:14px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;border:1px solid var(--line);border-radius:12px;padding:13px 14px;font:inherit}.btn{width:100%;border:0;border-radius:12px;padding:13px 15px;font:inherit;font-weight:800;margin-top:18px}.primary{background:var(--primary);color:#fff}.link{background:transparent;color:var(--primary);margin-top:8px}.notice{margin-top:17px;border:1px solid #d9e7eb;background:#f7fbfc;color:#38545f;border-radius:13px;padding:12px 13px;font-size:12px}.notice.error{border-color:#efcaca;background:#fff5f5;color:#8a2d2d}.notice.ok{border-color:#c8e5d2;background:#f3fbf6;color:#22643a}.footer{margin-top:18px;color:var(--muted);font-size:11px;text-align:center}.hidden{display:none}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/supabase-config.js?v=20260904-ui22"></script></head><body><div class="wrap"><main class="card"><div class="brand"><div class="logo" id="logo">NT</div><div><h1 id="title">NurseTrack Clinical</h1><p id="subtitle">SISTEMA CLÍNICO SEGURO</p></div></div><div class="badge"><span class="dot"></span><span id="security">Acceso clínico protegido</span></div><section id="loginView"><div class="field"><label>Usuario o correo electrónico</label><input id="username" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="passcode" type="password" autocomplete="current-password"></div><button class="btn primary" id="loginBtn">Entrar</button><button class="btn link" id="forgotBtn" type="button">¿Olvidó su contraseña?</button><div class="notice" id="statusBox">Acceso seguro listo.</div></section><section id="requestView" class="hidden"><div class="field"><label>Usuario o correo</label><input id="recoveryIdentifier"></div><button class="btn primary" id="sendCodeBtn">Enviar código por SMS</button><button class="btn link" id="sendEmailBtn">Enviar enlace por correo</button><button class="btn link" id="backBtn">Volver</button><div class="notice hidden" id="requestStatus"></div></section><section id="smsResetView" class="hidden"><div class="field"><label>Código de 6 dígitos</label><input id="smsCode" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="000000"></div><div class="field"><label>Nueva contraseña</label><input id="smsPassword" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres"></div><div class="field"><label>Confirmar contraseña</label><input id="smsPassword2" type="password" autocomplete="new-password"></div><button class="btn primary" id="resetSmsBtn">Cambiar contraseña</button><button class="btn link" id="resendSmsBtn">Solicitar otro código</button><button class="btn link" id="smsBackBtn">Volver</button><div class="notice" id="smsResetStatus">Escriba el código recibido por SMS.</div></section><div class="footer" id="footer">NurseTrack Clinical · Acceso seguro · Recuperación por SMS o correo</div></main></div><script>(async function(){try{const c=JSON.parse(localStorage.getItem('nursetrack_login_cover_v1')||'{}');if(c.title)title.textContent=c.title;if(c.subtitle)subtitle.textContent=c.subtitle;if(c.security)security.textContent=c.security;if(c.logo)logo.textContent=c.logo;if(c.footer)footer.textContent=c.footer;if(c.primary)document.documentElement.style.setProperty('--primary',c.primary);if(c.background)document.documentElement.style.setProperty('--bg',c.background)}catch(_){}const cfg=window.NURSETRACK_SUPABASE||{},client=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true}}),recoveryUrl=cfg.url.replace(/\/$/,'')+'/functions/v1/recover-by-sms',userLoginUrl=cfg.url.replace(/\/$/,'')+'/functions/v1/nursetrack-username-login';function show(el,msg,type){el.textContent=msg;el.classList.remove('hidden','error','ok');if(type)el.classList.add(type)}async function callJson(url,payload){const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','apikey':cfg.publishableKey},body:JSON.stringify(payload)}),d=await r.json().catch(()=>({}));if(!r.ok||d.ok===false)throw new Error(d.error||d.message||'No se pudo completar la solicitud.');return d}function only(v){[loginView,requestView,smsResetView].forEach(x=>x.classList.add('hidden'));v.classList.remove('hidden')}loginBtn.onclick=async()=>{try{const u=username.value.trim(),p=passcode.value;if(!u||!p){show(statusBox,'Escriba usuario y contraseña.','error');return}loginBtn.disabled=true;const d=await callJson(userLoginUrl,{action:'login',username:u,password:p});const {error}=await client.auth.setSession({access_token:d.access_token,refresh_token:d.refresh_token});if(error)throw error;location.replace('/cloud-app.html?v=20260904-med22')}catch(e){show(statusBox,e.message||'No se pudo entrar.','error');loginBtn.disabled=false}};forgotBtn.onclick=()=>{recoveryIdentifier.value=username.value.trim();only(requestView)};backBtn.onclick=()=>only(loginView);smsBackBtn.onclick=()=>only(requestView);sendCodeBtn.onclick=async()=>{try{const id=recoveryIdentifier.value.trim().toLowerCase();if(!id){show(requestStatus,'Escriba su usuario o correo.','error');return}sendCodeBtn.disabled=true;await callJson(recoveryUrl,{action:'request',identifier:id});smsCode.value='';smsPassword.value='';smsPassword2.value='';show(smsResetStatus,'Si la cuenta permite recuperación por SMS, revise su teléfono. El código vence en 10 minutos.','ok');only(smsResetView)}catch(e){show(requestStatus,e.message||'No se pudo enviar el código.','error')}finally{sendCodeBtn.disabled=false}};resendSmsBtn.onclick=async()=>{only(requestView);setTimeout(()=>sendCodeBtn.click(),0)};resetSmsBtn.onclick=async()=>{try{const id=recoveryIdentifier.value.trim().toLowerCase(),code=smsCode.value.trim(),p1=smsPassword.value,p2=smsPassword2.value;if(!/^\d{6}$/.test(code))return show(smsResetStatus,'Escriba el código de 6 dígitos.','error');if(p1.length<8)return show(smsResetStatus,'La contraseña debe tener al menos 8 caracteres.','error');if(p1!==p2)return show(smsResetStatus,'Las contraseñas no coinciden.','error');resetSmsBtn.disabled=true;await callJson(recoveryUrl,{action:'reset',identifier:id,code,password:p1});show(smsResetStatus,'✓ Contraseña actualizada. Ya puede iniciar sesión.','ok');setTimeout(()=>{username.value=id;passcode.value='';only(loginView);show(statusBox,'Contraseña actualizada. Inicie sesión con su nueva contraseña.','ok')},900)}catch(e){show(smsResetStatus,e.message||'No se pudo cambiar la contraseña.','error')}finally{resetSmsBtn.disabled=false}};sendEmailBtn.onclick=async()=>{try{const id=recoveryIdentifier.value.trim().toLowerCase();if(!id)return show(requestStatus,'Escriba su usuario o correo.','error');await callJson(userLoginUrl,{action:'recover',username:id});show(requestStatus,'Si la cuenta existe, se envió un enlace al correo.','ok')}catch(e){show(requestStatus,'Si la cuenta existe, se procesará la solicitud.','ok')}}})();</script></body></html>
