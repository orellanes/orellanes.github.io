<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>NurseTrack · Restablecer contraseña</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#eaf4f6,#f8fbfb)}.card{width:min(460px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;margin:auto;background:#397f88;color:#fff;font-size:24px;font-weight:900}h1{text-align:center;font-size:24px;margin:14px 0 5px}.sub{text-align:center;color:#6a8187;font-size:13px;line-height:1.45;margin-bottom:18px}.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;height:48px;border:1px solid #d7e3e5;border-radius:12px;padding:0 13px;font-size:16px}.btn{width:100%;height:50px;border:0;border-radius:13px;margin-top:18px;background:#397f88;color:#fff;font-weight:800;font-size:16px}.back{background:#fff;color:#397f88;border:1.5px solid #83b7bd;margin-top:10px}.note{margin-top:14px;text-align:center;color:#74898e;font-size:12px;line-height:1.45}.status{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:13px;line-height:1.4}@media(max-width:520px){.wrap{padding:12px;align-items:start;padding-top:max(22px,env(safe-area-inset-top))}.card{padding:22px 18px}}</style></head><body><div class="wrap"><div class="card"><div class="logo">NT</div><h1>Restablecer contraseña</h1><div class="sub">Recuperación de acceso de NurseTrack Clinical</div><div class="field"><label for="account">Usuario o correo registrado</label><input id="account" autocomplete="username" autocapitalize="none" placeholder="Usuario o correo"></div><button class="btn" id="continueBtn" type="button">Continuar</button><button class="btn back" type="button" onclick="location.href='index.html?v=1817'">← Volver al acceso</button><div class="status" id="status">Cuenta identificada. El siguiente paso será verificar la identidad antes de permitir una contraseña nueva.</div><div class="note">No necesitas escribir la membresía para iniciar la recuperación.</div></div></div><script>document.getElementById('continueBtn').onclick=function(){var a=document.getElementById('account');if(!a.value.trim()){a.focus();return}document.getElementById('status').style.display='block'};</script></body></html>
