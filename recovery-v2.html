<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>NurseTrack · Restablecer contraseña</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#eaf4f6,#f8fbfb)}.card{width:min(460px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:64px;height:64px;border-radius:19px;display:grid;place-items:center;margin:auto;background:#397f88;color:#fff;font-size:24px;font-weight:900}h1{text-align:center;font-size:24px;margin:14px 0 5px}.sub{text-align:center;color:#6a8187;font-size:13px;line-height:1.45;margin-bottom:18px}.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;height:48px;border:1px solid #d7e3e5;border-radius:12px;padding:0 13px;font-size:16px}.btn{width:100%;height:50px;border:0;border-radius:13px;margin-top:18px;background:#397f88;color:#fff;font-weight:800;font-size:16px}.btn[disabled]{opacity:.65}.back{background:#fff;color:#397f88;border:1.5px solid #83b7bd;margin-top:10px}.note{margin-top:14px;text-align:center;color:#74898e;font-size:12px;line-height:1.45}.status{display:none;margin-top:14px;padding:12px;border-radius:12px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:13px;line-height:1.4}.status.error{background:#fff3f3;border-color:#efcaca;color:#8a2d2d}@media(max-width:520px){.wrap{padding:12px;align-items:start;padding-top:max(22px,env(safe-area-inset-top))}.card{padding:22px 18px}}</style></head><body><div class="wrap"><div class="card"><div class="logo">NT</div><h1>Restablecer contraseña</h1><div class="sub">Escribe el correo registrado en NurseTrack Clinical.</div><div class="field"><label for="account">Correo registrado</label><input id="account" type="email" autocomplete="email" autocapitalize="none" placeholder="tu@correo.com"></div><button class="btn" id="continueBtn" type="button">Enviar enlace de recuperación</button><button class="btn back" type="button" onclick="location.href='index.html?v=1825'">← Volver al acceso</button><div class="status" id="status"></div><div class="note">Recibirás un correo con un enlace seguro para crear una contraseña nueva.</div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const client=supabase.createClient('https://ummubyacvgdobgbwvwmf.supabase.co','sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1');const btn=document.getElementById('continueBtn'),input=document.getElementById('account'),status=document.getElementById('status');btn.onclick=async function(){const email=input.value.trim();if(!email){input.focus();return}btn.disabled=true;btn.textContent='Enviando…';status.style.display='none';status.classList.remove('error');try{const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://orellanes.github.io/update-password.html'});if(error)throw error;status.textContent='Si ese correo está registrado, recibirás un enlace para restablecer la contraseña. Revisa también correo no deseado.';status.style.display='block'}catch(e){status.textContent='No se pudo enviar el enlace. '+(e&&e.message?e.message:'Intenta nuevamente.');status.classList.add('error');status.style.display='block'}finally{btn.disabled=false;btn.textContent='Enviar enlace de recuperación'}};</script></body></html>
