<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NurseTrack - Recuperar acceso</title><style>body{font-family:Arial,sans-serif;background:#f3f8f8;color:#17343c;margin:0}.card{max-width:430px;margin:40px auto;background:#fff;padding:28px;border-radius:22px}h1{text-align:center}label{display:block;font-weight:700;margin-top:15px}input,button{box-sizing:border-box;width:100%;height:50px;margin-top:7px;border-radius:12px;font-size:16px}input{border:1px solid #ccdadd;padding:12px}button{border:0;background:#397f88;color:#fff;font-weight:700;margin-top:18px}.secondary{background:#fff;color:#397f88;border:1px solid #397f88}.msg{margin-top:15px;padding:12px;background:#edf7f5;border-radius:10px;display:none}</style></head><body><div class="card"><h1>Restablecer contraseña</h1><div id="request"><p>Escribe el correo registrado en NurseTrack Clinical.</p><label>Correo registrado</label><input id="email" type="email"><button id="send">Enviar enlace de recuperación</button></div><div id="change" style="display:none"><p>Escribe y confirma tu contraseña nueva.</p><label>Nueva contraseña</label><input id="p1" type="password"><label>Confirmar contraseña</label><input id="p2" type="password"><button id="save">Guardar nueva contraseña</button></div><button class="secondary" onclick="location.href='index.html'">Volver al acceso</button><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=supabase.createClient('https://ummubyacvgdobgbwvwmf.supabase.co','sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1'),m=document.getElementById('msg');function show(t){m.textContent=t;m.style.display='block'}if(location.hash||location.search.includes('code=')){document.getElementById('request').style.display='none';document.getElementById('change').style.display='block'}document.getElementById('send').onclick=async()=>{let e=document.getElementById('email').value.trim();if(!e)return show('Escribe tu correo registrado.');let r=await c.auth.resetPasswordForEmail(e,{redirectTo:'https://orellanes.github.io/recovery-v2.html'});show(r.error?'No se pudo enviar el enlace.':'Revisa tu correo. Te enviamos un enlace para crear una contraseña nueva.')};document.getElementById('save').onclick=async()=>{let a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a.length<8)return show('La contraseña debe tener al menos 8 caracteres.');if(a!==b)return show('Las contraseñas no coinciden.');let r=await c.auth.updateUser({password:a});if(r.error)return show('El enlace no es válido o expiró. Solicita uno nuevo.');show('Contraseña actualizada correctamente. Ya puedes volver al acceso.')};</script></body></html>
