<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NurseTrack - Recuperar acceso</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c;margin:0;padding:18px}.card{max-width:430px;margin:22px auto;background:#fff;padding:28px;border-radius:22px;box-shadow:0 15px 45px rgba(35,74,82,.10)}h1{text-align:center;margin:0 0 8px}p{color:#627b82;line-height:1.45}label{display:block;font-weight:700;margin-top:15px}input,button{width:100%;height:50px;margin-top:7px;border-radius:12px;font-size:16px}input{border:1px solid #ccdadd;padding:12px}button{border:0;background:#397f88;color:#fff;font-weight:700;margin-top:18px;cursor:pointer}.secondary{background:#fff;color:#397f88;border:1px solid #397f88}.sms{background:#fff;color:#397f88;border:2px solid #397f88}.msg{margin-top:15px;padding:12px;background:#edf7f5;border-radius:10px;display:none;line-height:1.4}.error{background:#fff1f1;color:#8a2f2f}.hidden{display:none!important}.hint{font-size:12px;color:#71868b;margin-top:8px;line-height:1.4}
</style>
</head>
<body>
<div class="card">
<h1>Restablecer contraseña</h1>

<div id="requestView">
<p>Recupera la contraseña de tu cuenta de nube de NurseTrack.</p>
<label>Correo registrado</label>
<input id="email" type="email" autocomplete="email" placeholder="correo@ejemplo.com">
<button id="send" type="button">📧 Enviar enlace por correo</button>
<button class="sms" type="button" onclick="location.href='recovery-sms.html?v=20260829-2315'">💬 Recuperar por mensaje de texto (SMS)</button>
<div class="hint">El enlace por correo abre esta misma página en modo seguro para crear una nueva contraseña de nube.</div>
</div>

<div id="updateView" class="hidden">
<p>Escribe una nueva contraseña para tu cuenta de nube de NurseTrack.</p>
<label>Nueva contraseña</label>
<input id="newPass" type="password" autocomplete="new-password" minlength="8">
<label>Confirmar contraseña</label>
<input id="confirmPass" type="password" autocomplete="new-password" minlength="8">
<button id="savePass" type="button">Guardar nueva contraseña de nube</button>
</div>

<button class="secondary" type="button" onclick="location.href='index.html'">← Volver al acceso</button>
<div id="msg" class="msg"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const c=supabase.createClient(
  'https://ummubyacvgdobgbwvwmf.supabase.co',
  'sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1',
  {auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}
);
const m=document.getElementById('msg'),requestView=document.getElementById('requestView'),updateView=document.getElementById('updateView');
function show(t,bad){m.textContent=t;m.className='msg'+(bad?' error':'');m.style.display='block'}
function showUpdate(){requestView.classList.add('hidden');updateView.classList.remove('hidden');show('Enlace verificado. Ahora puedes crear una nueva contraseña de nube.');}

document.getElementById('send').onclick=async()=>{
  const e=document.getElementById('email').value.trim();
  if(!e)return show('Escribe tu correo registrado.',true);
  show('Enviando enlace…');
  const r=await c.auth.resetPasswordForEmail(e,{redirectTo:'https://orellanes.github.io/recovery-v2.html'});
  show(r.error?'No se pudo enviar el enlace. Inténtalo de nuevo.':'Revisa tu correo. Te enviamos un enlace para crear una nueva contraseña de nube.',!!r.error);
};

document.getElementById('savePass').onclick=async()=>{
  const p=document.getElementById('newPass').value,q=document.getElementById('confirmPass').value;
  if(p.length<8)return show('La contraseña debe tener al menos 8 caracteres.',true);
  if(p!==q)return show('Las contraseñas no coinciden.',true);
  show('Guardando nueva contraseña…');
  const r=await c.auth.updateUser({password:p});
  if(r.error)return show('No se pudo guardar la contraseña. Abre nuevamente el enlace recibido por correo.',true);
  show('Contraseña de nube actualizada correctamente. Ya puedes volver a NurseTrack y conectar la nube.');
  setTimeout(()=>{location.href='index.html?v=cloud-password-fixed'},2200);
};

c.auth.onAuthStateChange((event,session)=>{
  if(event==='PASSWORD_RECOVERY'&&session)showUpdate();
});
(async()=>{
  try{
    const hash=location.hash||'',search=location.search||'';
    const s=await c.auth.getSession();
    if((hash.includes('type=recovery')||search.includes('type=recovery'))&&s.data&&s.data.session)showUpdate();
  }catch(e){}
})();
</script>
</body>
</html>
