<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Verificar recuperación · NurseTrack</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(470px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;box-shadow:0 18px 55px rgba(35,74,82,.12);text-align:center}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:auto;background:#397f88;color:#fff;font-size:25px;font-weight:900}.status{margin:18px 0;padding:16px;border-radius:14px;background:#f7fbfb;border:1px solid #dce8e9;font-weight:800}.ok{background:#eef8f2;border-color:#cde4d4;color:#326849}.warn{background:#fff8e8;border-color:#ead9a8;color:#74591c}.btn{display:block;width:100%;text-decoration:none;border:0;border-radius:12px;padding:14px;margin-top:12px;background:#397f88;color:#fff;font-weight:800}.secondary{background:#fff;color:#397f88;border:1.5px solid #83b7bd}.muted{color:#6f858b;font-size:13px;line-height:1.55}</style></head><body><div class="wrap"><div class="card"><div class="logo">NT</div><h1>Verificar recuperación</h1><p class="muted">Esta pantalla revisa solamente el almacenamiento local de NurseTrack en este dispositivo. No borra ni cambia datos.</p><div id="status" class="status">Revisando pacientes…</div><a class="btn" id="openNew" href="cloud-preview.html?v=20260830-recoverycheck1">Abrir NurseTrack nuevo</a><a class="btn secondary" href="recover-patients.html?v=20260830-recoverycheck1">Volver a recuperación</a></div></div><script>(function(){var n=0;try{var x=JSON.parse(localStorage.getItem('nursetrack_clinical_v21')||'{}');n=Array.isArray(x.patients)?x.patients.length:0}catch(e){}var s=document.getElementById('status');if(n>0){s.className='status ok';s.textContent='✅ Recuperación detectada: '+n+' paciente'+(n===1?'':'s')+' en este dispositivo.'}else{s.className='status warn';s.textContent='⚠️ Todavía no se detectan pacientes en este dispositivo. Regrese a recuperación y use Actualizar desde nube / Sincronizar ahora.'}})();</script></body></html>
