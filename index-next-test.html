<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NurseTrack">
<meta name="theme-color" content="#0f6175">
<link rel="icon" type="image/png" href="NurseTrack_icon.png">
<link rel="apple-touch-icon" href="NurseTrack_icon.png">
<title>NurseTrack Clinical v2.6.2</title>
<style>
:root{--bg:#f3f7f8;--card:#fff;--text:#15313b;--muted:#6b7d85;--line:#dbe6ea;--primary:#0f6175;--primary2:#0b4d5d;--soft:#e9f4f6;--ok:#287a4b;--warn:#9a6812;--danger:#a33434;--shadow:0 8px 30px rgba(18,57,70,.08)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px}.brand{display:flex;align-items:center;gap:10px}.logo{width:42px;height:42px;border-radius:12px;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:900}.brand h1{font-size:20px;margin:0}.brand small{display:block;color:var(--muted);margin-top:2px}.user{display:flex;align-items:center;gap:10px}.user span{font-size:13px;color:var(--muted)}
.banner{background:#fff3d6;color:#76520b;border-bottom:1px solid #ecd18c;padding:7px 14px;text-align:center;font-size:12px;font-weight:700}.shell{display:grid;grid-template-columns:270px minmax(0,1fr);min-height:calc(100vh - 96px)}.side{background:#123d4b;padding:14px;color:#fff}.side .section-title{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:#a9c7d0;margin:12px 6px 8px}.navbtn,.patientbtn{width:100%;border:0;text-align:left;border-radius:10px;padding:10px 11px;background:transparent;color:#e8f3f6;margin-bottom:5px}.navbtn:hover,.navbtn.active,.patientbtn:hover,.patientbtn.active{background:rgba(255,255,255,.12)}.patientbtn small{display:block;color:#a9c7d0;margin-top:3px}.search{margin:8px 0 10px}.search input{background:#fff}.main{padding:22px;overflow:auto}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:16px}.pagehead h2{margin:0 0 4px}.muted{color:var(--muted)}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);margin-bottom:16px}.metrics{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}.metric{background:#fff;border:1px solid var(--line);border-radius:14px;padding:15px;box-shadow:var(--shadow)}.metric span{display:block;font-size:13px;color:var(--muted)}.metric strong{display:block;font-size:30px;margin-top:5px}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700}.btn.primary{background:var(--primary);color:#fff}.btn.primary:hover{background:var(--primary2)}.btn.secondary{background:#e9eef0;color:var(--text)}.btn.ghost{background:transparent;color:var(--primary)}.btn.danger{background:#faeaea;color:var(--danger)}.btn.small{padding:7px 9px;font-size:12px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px 11px;color:var(--text)}input:focus,select:focus,textarea:focus{outline:3px solid rgba(15,97,117,.12);border-color:var(--primary)}.span2{grid-column:span 2}
.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{border:0;border-radius:10px;padding:10px 14px;background:#e9eef0;white-space:nowrap;font-weight:700}.tab.active{background:var(--primary);color:#fff}.patientname{font-size:28px;margin:0}.patientmeta{color:var(--muted);margin-top:4px}.vitals{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.vital{background:var(--soft);border-radius:12px;padding:12px;text-align:center}.vital span{display:block;font-size:12px;color:var(--muted)}.vital strong{display:block;font-size:20px;margin-top:4px}.visit{border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:12px;padding:14px;margin-top:10px}.visit.closed{border-left-color:var(--ok)}.visit.draft{border-left-color:#c7861a}.visithead{display:flex;justify-content:space-between;gap:10px}.pill{font-size:12px;font-weight:800;border-radius:999px;padding:5px 8px;background:#edf2f4}.pill.closed{background:#e5f4eb;color:var(--ok)}.pill.draft{background:#fff1d8;color:var(--warn)}.pill.discharged{background:#ece7ff;color:#5c3aa3}.timeline{border-left:3px solid var(--line);padding-left:14px;margin:14px 0}.timeline small{color:var(--muted)}.empty{padding:28px;text-align:center;color:var(--muted)}
dialog{width:min(960px,calc(100% - 24px));max-height:calc(100vh - 24px);border:0;border-radius:18px;padding:0;box-shadow:0 25px 70px rgba(0,0,0,.25)}dialog::backdrop{background:rgba(0,0,0,.45)}.dialogbody{padding:20px}.dialoghead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.dialoghead h2{margin:0}.dialogactions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.syncbox{display:flex;align-items:center;justify-content:space-between;gap:14px;background:#eef7f9;border:1px solid #cfe3e8;border-radius:14px;padding:14px}.syncdot{width:10px;height:10px;border-radius:50%;background:#287a4b;display:inline-block;margin-right:7px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid var(--line);font-size:13px}th{color:var(--muted)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#eaf4f6,#f7fafb)}.loginbox{width:min(460px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:28px;box-shadow:var(--shadow)}.loginbox h1{margin:12px 0 2px}.loginbox .field{margin-top:14px}.notice{background:#fff3d6;border:1px solid #ecd18c;color:#76520b;border-radius:12px;padding:12px;margin:18px 0;font-size:13px}
.checkgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.checkitem{display:flex;gap:9px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}.checkitem input{width:auto;margin-top:3px}.sectionbox{background:#f8fbfc;border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px}.sectionbox h3{margin:0 0 10px}.census-actions{display:flex;gap:6px;flex-wrap:wrap}.fileitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.fileitem:last-child{border-bottom:0}.status-ok{color:var(--ok);font-weight:800}.status-warn{color:var(--warn);font-weight:800}
@media(max-width:1150px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:980px){.shell{grid-template-columns:1fr}.side{position:sticky;top:96px;z-index:15;display:flex;gap:6px;overflow:auto;padding:8px}.side .section-title,.side .search,#patientList{display:none}.navbtn{width:auto;white-space:nowrap;margin:0}.vitals{grid-template-columns:repeat(3,1fr)}}@media(max-width:620px){.main{padding:14px}.formgrid,.checkgrid{grid-template-columns:1fr}.span2{grid-column:span 1}.pagehead{flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.vitals{grid-template-columns:1fr 1fr}.user span{display:none}.dialogactions{flex-direction:column}.dialogactions .btn{width:100%}}
@media print{.top,.banner,.side,.btn,.tabs,.syncbox,.no-print{display:none!important}.shell{display:block}.main{padding:0}.card{box-shadow:none}body{background:#fff}}
</style>
</head>
<body>
<section id="loginScreen" class="login"><div class="loginbox"><div class="logo">NT</div><h1>NurseTrack Clinical</h1><p class="muted">Acceso clínico</p><div id="unlockBox"><div class="field"><label>PIN</label><input id="loginPin" type="password"></div><button class="btn primary" id="loginBtn" type="button">Desbloquear</button></div></div></section>
<section id="appScreen" class="hidden"><header class="top"><div class="brand"><div class="logo">NT</div><div><h1>NurseTrack Clinical</h1><small>Expediente clínico</small></div></div><div class="user"><span id="userBadge"></span><button class="btn secondary" id="logoutBtn">Bloquear</button></div></header><div class="banner">NurseTrack Clinical</div><div class="shell"><aside class="side"><button class="navbtn active" data-page="home">🏠 Censo</button><button class="navbtn" data-page="patients">👥 Pacientes</button><button class="navbtn" data-page="newPatient">➕ Nuevo paciente</button><button class="navbtn" data-page="backup">💾 Respaldo / Excel</button><button class="navbtn" data-page="settings">⚙️ Configuración</button><button class="navbtn" data-page="audit">🧾 Auditoría</button><div class="section-title">Buscar paciente</div><div class="search"><input id="sideSearch" placeholder="Nombre o MRN"></div><div id="patientList"></div></aside><main class="main"><section id="homePage"><div class="pagehead"><div><h2>Censo del día</h2><div class="muted">Pacientes activos.</div></div><button class="btn primary" id="newPatientHome">+ Nuevo paciente</button></div><div class="metrics"><div class="metric"><span>Activos</span><strong id="mActive">0</strong></div><div class="metric"><span>Pendientes hoy</span><strong id="mPending">0</strong></div><div class="metric"><span>Completados hoy</span><strong id="mCompleted">0</strong></div><div class="metric"><span>Alertas</span><strong id="mAlerts">0</strong></div><div class="metric"><span>Altas este mes</span><strong id="mDisMonth">0</strong></div><div class="metric"><span>Altas este año</span><strong id="mDisYear">0</strong></div></div><div class="card"><div id="censusTable" class="tablewrap"></div></div></section><section id="patientsPage" class="hidden"><div class="pagehead"><div><h2>Pacientes</h2></div><button class="btn primary" id="newPatientTop">+ Nuevo paciente</button></div><div class="card"><div class="row"><input id="mainSearch" placeholder="Buscar"><select id="statusFilter"><option>Todos</option><option>Activo</option><option>Alta</option><option>Inactivo</option></select></div><div id="patientTable"></div></div></section><section id="newPatientPage" class="hidden"><form id="newPatientForm" class="card formgrid"><div class="field"><label>MRN *</label><input name="mrn" required></div><div class="field"><label>Nombre *</label><input name="firstName" required></div><div class="field"><label>Apellidos *</label><input name="lastName" required></div><div class="field"><label>Fecha nacimiento</label><input name="dob" type="date"></div><div class="span2"><button class="btn primary">Guardar paciente</button></div></form></section><section id="patientPage" class="hidden"><div class="pagehead"><div><button class="btn ghost" id="backPatients">← Pacientes</button><h2 class="patientname" id="patientName">—</h2><div class="patientmeta" id="patientMeta"></div></div><div class="row"><button class="btn primary" id="newVisit">+ Nueva visita</button></div></div><div class="tabs"><button class="tab active" data-tab="demo">Demográfico</button><button class="tab" data-tab="social">Social</button><button class="tab" data-tab="nursing">Enfermería</button><button class="tab" data-tab="documents">Documentos</button><button class="tab" data-tab="history">Historial</button></div><div id="demoTab" class="card"></div><div id="socialTab" class="card hidden"></div><div id="nursingTab" class="card hidden"></div><div id="documentsTab" class="card hidden"></div><div id="historyTab" class="card hidden"></div></section><section id="backupPage" class="hidden"><div class="card"><h2>Respaldo</h2></div></section><section id="settingsPage" class="hidden"><div class="card"><h2>Configuración</h2></div></section><section id="auditPage" class="hidden"><div id="auditBox" class="card"></div></section></main></div></section>
<script>(function(){var AUTH='nursetrack_clinical_auth_v21';function read(){try{return JSON.parse(localStorage.getItem(AUTH)||'null')}catch(_){return null}}var auth=read();function show(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');document.getElementById('userBadge').textContent=(auth&&auth.name)||'Usuario'}document.getElementById('loginBtn').onclick=function(){show()};if(auth&&auth.cloud)show();window.NURSETRACK_LOCAL_API=window.NURSETRACK_LOCAL_API||{getPatient:function(){return window.__ntPatient||null},getState:function(){return {patients:[],labOrders:[]}},save:function(){}}})();</script>
</body></html>
