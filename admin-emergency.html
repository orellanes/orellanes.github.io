document.getElementById('refreshBtn').onclick=readCloud;document.getElementById('openBtn').onclick=()=>location.href='cloud-preview.html?v='+VERSION;document.getElementById('logoutBtn').onclick=async()=>{await sb.auth.signOut();location.replace('login-preview.html?v='+VERSION)};document.getElementById('backupBtn').onclick=async()=>{let s=await sb.from('nursetrack_state').select('*').eq('user_id',user.id).maybeSingle(),m=await sb.from('nursetrack_modules').select('*').eq('user_id',user.id).maybeSingle(),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),state:s.data||null,modules:m.data||null},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='nursetrack-emergency-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click()};init()})();</script></body></html>
