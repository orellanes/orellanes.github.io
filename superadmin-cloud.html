ipt></head><body><div class="wrap"><div class="head"><div class="brand"><div class="logo">NT</div><div><h1 style="margin:0;font-size:24px">Súper Administrador</h1><div class="muted">Administración de usuarios en la nube</div></div></div><button class="btn secondary" id="backBtn">← Volver a NurseTrack</button></div><div class="card" id="authCard"><strong>Verificando sesión y permisos…</strong><div class="muted" style="margin-top:6px">Esta página usa directamente la nube de NurseTrack.</div></div><div id="panel" style="display:none"><div class="card"><h2 style="margin-top:0">👥 Crear usuario</h2><div class="grid"><div class="field"><label>Nombre completo</label><input id="full"></div><div class="field"><label>Usuario</label><input id="username"></div><div class="field"><label>Email de acceso</label><input id="email" type="email"></div><div class="field"><label>Rol</label><select id="role"><option value="nurse">Enfermería</option><option value="social_worker">Trabajo Social</option><option value="provider">Proveedor clínico</option><option value="admin">Administrador</option><option value="user">Usuario general</option></select></div><div class="field"><label>Teléfono recuperación</label><input id="phone"></div><div class="field"><label>Email recuperación</label><input id="recovery" type="email"></div><div class="field"><label>Compañía / clínica</label><input id="company"></div><div class="field"><label>Contraseña temporal</label><input id="password" type="password" autocomplete="new-password"></div></div><div class="row" style="margin-top:12px"><button class="btn primary" id="createBtn">+ Crear usuario</button><span id="createStatus" class="status muted">La contraseña temporal debe tener al menos 8 caracteres.</span></div></div><div class="card"><div class="row" style="justify-content:space-between"><div><h2 style="margin:0">Usuarios del sistema</h2><div class="muted">Se cargan directamente desde Supabase.</div></div><button class="btn secondary" id="reloadBtn">Actualizar lista</button></div><div id="list" style="margin-top:10px">Cargando…</div></div></div></div><script>(async function(){'use strict';const URL='https://ummubyacvgdobgbwvwmf.supabase.co',KEY='sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1',FN=URL+'/functions/v1/admin-users';const sb=supabase.createClient(URL,KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const authCard=document.getElementById('authCard'),panel=document.getElementById('panel'),list=document.getElementById('list'),createStatus=document.getElementById('createStatus');document.getElementById('backBtn').onclick=()=>location.href='cloud-preview.html?v=20260902-safe37-admin7&t='+Date.now();function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function session(){const r=await sb.auth.getSession();return r.data&&r.data.session}async function call(payload){const s=await session();if(!s)throw new Error('Sesión no disponible. Inicia sesión nuevamente.');const r=await fetch(FN,{method:'POST',headers:{'content-type':'application/json','authorization':'Bearer '+s.access_token,'apikey':KEY},body:JSON.stringify(payload)});const j=await r.json().catch(()=>({}));if(!r.ok||j.ok===false)throw new Error(j.error||'No se pudo completar la operación.');return j}async function load(){list.textContent='Cargando…';try{const d=await call({action:'list'}),rows=d.users||[];list.innerHTML=rows.length?rows.map(r=>'<div class="user"><div><strong>'+esc(r.full_name||r.username)+'</strong><div class="muted" style="font-size:12px">'+esc(r.username)+' · '+esc(r.role)+' · '+(r.active?'Activo':'Inactivo')+(r.must_change_password?' · Cambio pendiente':'')+'</div></div><div class="row"><span class="pill">'+(r.active?'Activo':'Inactivo')+'</span><button class="btn secondary toggle" data-id="'+esc(r.user_id)+'" data-active="'+(r.active?'1':'0')+'">'+(r.active?'Desactivar':'Activar')+'</button></div></div>').join(''):'No hay usuarios adicionales.';list.querySelectorAll('.toggle').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call({action:'set-active',user_id:b.dataset.id,active:b.dataset.active!=='1'});await load()}catch(e){alert(e.message)}finally{b.disabled=false}})}catch(e){list.textContent=e.message}}document.getElementById('reloadBtn').onclick=load;document.getElementById('createBtn').onclick=async function(){this.disabled=true;createStatus.textContent='Creando usuario en la nube…';try{const d=await call({action:'create',full_name:document.getElementById('full').value.trim(),username:document.getElementById('username').value.trim(),email:document.getElementById('email').value.trim(),role:document.getElementById('role').value,recovery_phone:document.getElementById('phone').value.trim(),recovery_email:document.getElementById('recovery').value.trim(),company:document.getElementById('company').value.trim(),password:document.getElementById('password').value});createStatus.textContent=d.message||'Usuario creado.';['full','username','email','phone','recovery','company','password'].forEach(id=>document.getElementById(id).value='');await load()}catch(e){createStatus.textContent=e.message}finally{this.disabled=false}};const s=await session();if(!s){authCard.innerHTML='<strong>Sesión no encontrada.</strong><div class="muted" style="margin-top:6px">Abre NurseTrack e inicia sesión nuevamente.</div>';return}const {data:me}=await sb.from('nursetrack_profiles').select('role,active').eq('user_id',s.user.id).maybeSingle();if(!me||me.active!==true||!['superadmin','superadministrator'].includes(String(me.role||'').toLowerCase())){authCard.innerHTML='<strong>Acceso restringido.</strong><div class="muted" style="margin-top:6px">Esta página es exclusiva del Súper Administrador.</div>';return}authCard.innerHTML='<strong>✅ Conectado a la nube</strong><div class="muted" style="margin-top:6px">Rol verificado: '+esc(me.role)+'.</div>';panel.style.display='block';await load()})();</script></body></htm
