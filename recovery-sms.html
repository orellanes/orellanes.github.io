<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NurseTrack SMS</title><style>body{font-family:Arial;background:#f3f8f8;color:#17343c;margin:0}.card{max-width:430px;margin:35px auto;background:white;padding:26px;border-radius:20px}h1{text-align:center}label{display:block;font-weight:700;margin-top:14px}input,button{width:100%;box-sizing:border-box;height:48px;margin-top:7px;border-radius:11px;font-size:16px}input{border:1px solid #ccdadd;padding:10px}button{border:0;background:#397f88;color:white;font-weight:700;margin-top:16px}.secondary{background:white;color:#397f88;border:1px solid #397f88}.phone{margin:16px 0;padding:14px;border:1px solid #cfe3df;background:#edf7f5;border-radius:12px;text-align:center;font-weight:700}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;background:#edf7f5}.hide{display:none}</style></head><body><div class="card"><h1>Recuperación por SMS</h1><p>Recibe un código de 6 dígitos en tu teléfono registrado.</p><div class="phone">📱 Enviar código a: •••-•••-9299</div><label>Usuario o correo registrado</label><input id="id" placeholder="Usuario o correo"><button id="send">Enviar código por texto</button><div id="step2" class="hide"><label>Código recibido</label><input id="code" inputmode="numeric" maxlength="6"><label>Nueva contraseña</label><input id="p1" type="password"><label>Confirmar contraseña</label><input id="p2" type="password"><button id="save">Guardar nueva contraseña</button></div><button class="secondary" onclick="location.href='recovery-v2.html'">Volver</button><div id="msg" class="msg"></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const c=supabase.createClient('https://ummubyacvgdobgbwvwmf.supabase.co','sb_publishable_KQOrfgQCG35W_sQIYDvbvw_tow1VFn1'),m=document.getElementById('msg');function show(t){m.textContent=t;m.style.display='block'}document.getElementById('send').onclick=async()=>{const identifier=document.getElementById('id').value.trim();if(!identifier)return show('Escribe tu usuario o correo.');const r=await c.functions.invoke('recover-by-sms',{body:{action:'request',identifier}});if(r.error||!r.data||r.data.ok===false)return show((r.data&&r.data.error)||'No se pudo enviar el código.');show(r.data.message||'Código enviado al teléfono terminado en 9299.');document.getElementById('step2').classList.remove('hide')};document.getElementById('save').onclick=async()=>{const identifier=document.getElementById('id').value.trim(),code=document.getElementById('code').value.trim(),a=document.getElementById('p1').value,b=document.getElementById('p2').value;if(a!==b)return show('Las contraseñas no coinciden.');const r=await c.functions.invoke('recover-by-sms',{body:{action:'reset',identifier,code,password:a}});if(r.error||!r.data||r.data.ok===false)return show((r.data&&r.data.error)||'No se pudo cambiar la contraseña.');show(r.data.message||'Contraseña actualizada.')};</script></body></html>
