<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="theme-color" content="#0b63a8">
<title>NurseTrack Clinical v3.8</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c;overflow:hidden}.boot{position:fixed;inset:0;display:grid;place-items:center;padding:18px;background:#f3f8f8;z-index:20}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:22px;padding:26px;text-align:center;box-shadow:0 18px 55px rgba(35,74,82,.12)}.muted{color:#6f858b;line-height:1.5}.small{font-size:12px;margin-top:8px}.error{color:#923f3f}.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:800;cursor:pointer;margin:6px;background:#0b63a8;color:#fff}#appframe{position:fixed;inset:0;border:0;width:100vw;height:100vh;display:block;background:#f3f8f8;visibility:hidden;pointer-events:auto;z-index:1}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
</head>
<body>
<div id="boot" class="boot"><div class="card"><h2>NurseTrack Clinical</h2><strong>v3.8 · CARGADOR UNIVERSAL</strong><p id="bootMsg" class="muted">Buscando la versión más reciente…</p><div id="bootStep" class="muted small">Control de versión</div></div></div>
<iframe id="appframe" title="NurseTrack Clinical"></iframe>
<script>
(async function(){
'use strict';
const FALLBACK='20260905-pointerfix8';
const qs=new URLSearchParams(location.search);
const incoming=qs.get('v')||'';
const boot=document.getElementById('boot'),msg=document.getElementById('bootMsg'),step=document.getElementById('bootStep'),frame=document.getElementById('appframe');
function setStep(t){if(step)step.textContent=t}
function fail(t){if(boot){boot.style.display='grid';boot.style.pointerEvents='auto'}frame.style.visibility='hidden';msg.textContent=t;msg.className='muted error';step.innerHTML='<button class="btn" onclick="location.reload()">Reintentar</button><button class="btn" onclick="location.replace(\'login-safe6.html?v='+FALLBACK+'\')">Ir al login</button>'}
function timeout(p,ms,label){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error(label||'timeout')),ms))])}
let latest=FALLBACK;
try{const vr=await timeout(fetch('nursetrack-version.json?t='+Date.now(),{cache:'no-store'}),2500,'version');if(vr.ok){const j=await vr.json();if(j&&j.build)latest=String(j.build)}}catch(_){ }
if(incoming&&incoming!==latest){location.replace('app-safe6.html?v='+encodeURIComponent(latest)+'&r='+Date.now());return}
window.NURSETRACK_PUBLIC_BUILD=latest;
setStep('Validando sesión de nube…');
try{
 const cfg=window.NURSETRACK_SUPABASE||{};
 if(!window.supabase||!cfg.url||!cfg.publishableKey)throw new Error('No se pudo cargar el servicio de nube.');
 const sb=supabase.createClient(cfg.url,cfg.publishableKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
 window.NURSETRACK_CLOUD_CLIENT=sb;window.nt28Cloud=sb;window.nt28CloudStart=async()=>sb;
 let session=null;
 try{const sr=await timeout(sb.auth.getSession(),3500,'session');session=sr&&sr.data&&sr.data.session}catch(_){ }
 if(!session){location.replace('login-safe6.html?v='+encodeURIComponent(latest));return}
 const displayName=(session.user&&((session.user.user_metadata&&session.user.user_metadata.display_name)||session.user.email))||'Cloud user';
 try{localStorage.setItem('nursetrack_clinical_auth_v21',JSON.stringify({name:displayName,pinHash:'811c9dc5',cloud:true}))}catch(_){ }
 setStep('Abriendo NurseTrack…');
 const src='index.html.html?v='+encodeURIComponent(latest)+'&cloud=1&t='+Date.now();
 let revealed=false,configured=false;
 function configureAndReveal(){
   if(configured)return true;
   try{
     const w=frame.contentWindow,d=frame.contentDocument;
     if(!w||!d)return false;
     const app=d.getElementById('appScreen');
     if(!app)return false;
     configured=true;
     w.NURSETRACK_CLOUD_CLIENT=sb;w.nt28Cloud=sb;w.nt28CloudStart=async()=>sb;w.NURSETRACK_PUBLIC_BUILD=latest;
     const st=d.createElement('style');st.id='ntCloudUniversalOverride';st.textContent='html,body,#appScreen{pointer-events:auto!important}#loginScreen{display:none!important;pointer-events:none!important}#appScreen{display:block!important}#appScreen.hidden{display:block!important}button,a,input,select,textarea,[role="button"]{pointer-events:auto!important}';(d.head||d.documentElement).appendChild(st);
     function enforce(){const login=d.getElementById('loginScreen'),ap=d.getElementById('appScreen');if(login){login.classList.add('hidden');login.style.setProperty('display','none','important');login.style.setProperty('pointer-events','none','important')}if(ap){ap.classList.remove('hidden');ap.style.setProperty('display','block','important');ap.style.setProperty('pointer-events','auto','important')}}
     enforce();
     try{d.documentElement.style.pointerEvents='auto';d.body.style.pointerEvents='auto'}catch(_){ }
     try{const mo=new MutationObserver(enforce);mo.observe(d.documentElement,{attributes:true,childList:true,subtree:true,attributeFilter:['class','style']})}catch(_){ }
     frame.style.visibility='visible';frame.style.pointerEvents='auto';frame.style.zIndex='10';
     if(boot){boot.style.pointerEvents='none';boot.style.display='none';setTimeout(()=>{try{boot.remove()}catch(_){}},0)}
     revealed=true;
     try{frame.focus();w.focus()}catch(_){ }
     setTimeout(async function(){
       const scripts=['module-v3-on-demand-features-safe37.js','module-v3-user-permission-guard-safe37.js','safe6-superadmin-compat.js','module-v3-superadmin-verified-access-safe37.js','module-v3-performance-panel-safe37.js','module-v3-superadmin-center-safe37.js','module-v3-template-direct-launcher-safe37.js','safe6-template-route-fix.js','safe6-patient-template-launcher.js','module-v3-personal-documents-safe37.js','safe6-my-folder-excel.js','safe6-patient-delete.js','module-v3-patient-drop-import-safe37.js','module-v3-patient-data-import-preview-safe37.js','module-v3-patient-pdf-data-extract-safe37.js','safe6-isolation.js','boceto-ui-runtime.js','safe6-superadmin-master-center.js','nursetrack-update-watcher.js'];
       for(const name of scripts){try{await new Promise(res=>{const s=d.createElement('script');s.src=name+'?v='+encodeURIComponent(latest);s.onload=res;s.onerror=res;(d.body||d.documentElement).appendChild(s)})}catch(_){ }}
       enforce();
     },50);
     return true;
   }catch(_){return false}
 }
 frame.src=src;
 const poll=setInterval(()=>{if(configureAndReveal())clearInterval(poll)},120);
 frame.onload=function(){configureAndReveal()};
 setTimeout(()=>{if(!revealed){clearInterval(poll);fail('NurseTrack no terminó de abrir. Toca Reintentar.')}},9000);
}catch(e){fail(e&&e.message||'No se pudo iniciar NurseTrack.')}
})();
</script>
</body>
</html>
