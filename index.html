<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#397f88"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>NurseTrack Clinical v3.0</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(180deg,#eaf4f6,#f8fbfb)}.card{width:min(460px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:26px;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:auto;background:#397f88;color:#fff;font-size:25px;font-weight:900}h1{text-align:center;margin:14px 0 4px;font-size:25px}.sub{text-align:center;color:#6a8187;font-size:13px;line-height:1.45;margin-bottom:18px}.badge{display:block;width:max-content;max-width:100%;margin:0 auto 18px;padding:7px 11px;border-radius:999px;background:#edf7f5;border:1px solid #cfe4df;color:#2f6971;font-size:12px;font-weight:800}.field{margin-top:13px}.field label{display:block;font-size:13px;font-weight:800;margin-bottom:6px}input{width:100%;height:48px;border:1px solid #d7e3e5;border-radius:12px;padding:0 13px;font-size:16px}.btn{width:100%;height:50px;border:0;border-radius:13px;margin-top:18px;background:#397f88;color:#fff;font-weight:800;font-size:16px}.recover{margin-top:10px;background:#fff;color:#397f88;border:1.5px solid #83b7bd}.note{margin-top:14px;text-align:center;color:#74898e;font-size:11px;line-height:1.45}.error{display:none;margin-top:12px;padding:10px 12px;border-radius:10px;background:#fff3d6;color:#76520b;font-size:12px}.app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;display:none;z-index:20}.loading{display:none;margin-top:12px;text-align:center;color:#397f88;font-size:13px;font-weight:700}@media(max-width:520px){.wrap{padding:12px;align-items:start;padding-top:max(22px,env(safe-area-inset-top))}.card{padding:22px 18px;border-radius:20px}}</style></head><body><div class="wrap" id="portal"><div class="card"><div class="logo">NT</div><h1>NurseTrack Clinical</h1><div class="sub">Acceso seguro · versión clínica móvil y escritorio</div><div class="badge">v3.0 · PRUEBA BASE</div><form id="portalForm"><div class="field"><label>Membresía</label><input id="membership" autocomplete="organization" placeholder="Membresía / compañía"></div><div class="field"><label>Usuario</label><input id="user" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="Usuario"></div><div class="field"><label>Passcode</label><input id="pin" type="password" autocomplete="current-password" enterkeyhint="go" placeholder="Passcode"></div><button class="btn" type="submit">Entrar</button><button class="btn recover" id="recoverBtn" type="button">🔒 Restablecer contraseña</button><div class="loading" id="loading">Abriendo NurseTrack…</div><div class="error" id="err">Usuario o passcode no reconocido.</div></form><div class="note">Prueba de estabilidad: solo aplicación base, sin módulos adicionales.</div></div></div><iframe class="app" id="appFrame" title="NurseTrack Clinical"></iframe><script>(function(){var form=document.getElementById('portalForm'),frame=document.getElementById('appFrame'),portal=document.getElementById('portal'),loading=document.getElementById('loading'),err=document.getElementById('err');var VERSION='20260829-baseonly';function hideInternalLogin(d,u){try{d.querySelectorAll('[class*="login"],[id*="login"]').forEach(function(x){if(x.id!=='appScreen'&&!x.contains(d.getElementById('appScreen')))x.style.display='none'});var n=u;while(n&&n.parentElement&&n.parentElement!==d.body)n=n.parentElement;if(n&&n!==d.body)n.style.display='none'}catch(e){}}function openApp(){var user=document.getElementById('user').value.trim(),pin=document.getElementById('pin').value;if(!user){document.getElementById('user').focus();return}if(!pin){document.getElementById('pin').focus();return}loading.style.display='block';err.style.display='none';frame.onload=function(){try{var d=frame.contentDocument||frame.contentWindow.document,u=d.getElementById('loginName'),p=d.getElementById('loginPin'),b=d.getElementById('loginBtn');if(!u||!p||!b)throw 0;u.value=user;p.value=pin;b.click();setTimeout(function(){var app=d.getElementById('appScreen');if(app&&!app.classList.contains('hidden')){hideInternalLogin(d,u);app.style.display='';frame.style.display='block';portal.style.display='none';loading.style.display='none'}else{loading.style.display='none';err.style.display='block';frame.removeAttribute('src')}},700)}catch(e){loading.style.display='none';err.style.display='block';frame.removeAttribute('src')}};frame.src='index%20(3).html?v='+VERSION}form.addEventListener('submit',function(e){e.preventDefault();openApp()});document.getElementById('recoverBtn').addEventListener('click',function(){location.href='recovery-v2.html?v=baseonly'});['membership','user','pin'].forEach(function(id){document.getElementById(id).addEventListener('keydown',function(e){if(e.key==='Enter'){e.preventDefault();openApp()}})})})();</script></body></html>
