<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef8f7">
<title>NurseTrack Clinical</title>
<style>
body{font-family:Arial,sans-serif;background:#eef8f7;margin:0;padding:32px 18px;color:#23464f}
main{max-width:440px;margin:auto;background:white;padding:24px;border-radius:16px;border:1px solid #cfe4e2;box-shadow:0 8px 30px rgba(0,0,0,.05)}
.brand{text-align:center;margin-bottom:20px}.emblem{width:70px;height:70px;margin:0 auto 8px;border-radius:50%;border:2px solid #91cec8;background:#e6f6f3;display:grid;place-items:center;color:#168d94;font-size:34px}h1{font-size:28px;margin:0;color:#0d4c61}.teal{color:#168e97}.subtitle{margin-top:5px;color:#657c83;font-size:14px}
label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;height:48px;font-size:18px;padding:0 12px;border:1px solid #9fb8bb;border-radius:10px;background:white;color:#111}button{width:100%;height:48px;margin-top:14px;font-size:16px;border-radius:10px;font-weight:700;cursor:pointer}.enter{border:0;background:#178f9a;color:white}.recover{border:1px solid #79bbc0;background:white;color:#197f87}.join{border:1px solid #3b8e75;background:#eef8f3;color:#286650}.join small{display:block;font-size:11px;margin-top:2px}.service{margin:18px 0 8px;padding:12px;border:1px solid #dcebea;border-radius:12px;background:#f9fcfb;font-size:14px}.msg{text-align:center;min-height:18px;margin-top:10px;font-size:13px;color:#7c6a2f}#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:white;z-index:1000}
</style>
</head>
<body>
<main id="cover">
  <div class="brand"><div class="emblem">✚</div><h1>NurseTrack <span class="teal">Clinical</span></h1><div class="subtitle">Censo · enfermería · seguimiento clínico</div></div>
  <div class="service"><strong>Dirección del servicio</strong><br><small>Información del servicio o unidad clínica</small></div>
  <button id="join" class="join" type="button">Crear membresía / Registrarme<small>Nuevo usuario u organización</small></button>
  <label for="user">Usuario</label>
  <input id="user" name="user" type="text" autocomplete="username" autocapitalize="none">
  <label for="pass">Passcode</label>
  <input id="pass" name="pass" type="password" autocomplete="current-password">
  <button id="enter" class="enter" type="button">Entrar</button>
  <button id="recover" class="recover" type="button">Restablecer contraseña</button>
  <div id="msg" class="msg"></div>
</main>
<iframe id="appFrame" src="index%20(3).html?v=304"></iframe>
<script>
(function(){
var AUTH='nursetrack_clinical_auth_v21';
var cover=document.getElementById('cover'),frame=document.getElementById('appFrame'),user=document.getElementById('user'),pass=document.getElementById('pass'),msg=document.getElementById('msg'),ready=false;
function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
frame.addEventListener('load',function(){
  ready=true;
  try{
    var d=doc();
    [['ntAdminCenterLoader','admin-center.js?v=293'],['ntTemplateDesignLoader','template-design.js?v=294'],['ntVisitAgendaLoader','visit-agenda.js?v=304'],['ntClinicalSafetyLoader','clinical-safety.js?v=296'],['ntProviderHandoffLoader','provider-handoff.js?v=297'],['ntPatientAppointmentLoader','patient-appointment.js?v=304'],['ntModuleSyncLoader','module-sync.js?v=304']].forEach(function(a){if(!d.getElementById(a[0])){var s=d.createElement('script');s.id=a[0];s.src=a[1];d.head.appendChild(s)}});
  }catch(e){}
});
function wait(cb){
  if(ready&&doc())return cb();
  msg.textContent='Abriendo NurseTrack…';
  setTimeout(function(){if(ready&&doc()){msg.textContent='';cb()}else msg.textContent='NurseTrack todavía está cargando. Intente nuevamente.'},900);
}
function alias(u){
  var l=u.toLowerCase();
  if(l!=='admin'&&l!=='administrador')return u;
  try{var a=JSON.parse(localStorage.getItem(AUTH)||'null');return a&&a.name?a.name:u}catch(e){return u}
}
function login(){
  var u=user.value.trim(),p=pass.value;
  if(!u||!p){msg.textContent='Escriba usuario y passcode.';return}
  wait(function(){
    var d=doc(),iu=d.getElementById('loginName'),ip=d.getElementById('loginPin'),b=d.getElementById('loginBtn');
    if(!iu||!ip||!b){msg.textContent='No se pudo abrir el acceso de NurseTrack.';return}
    iu.value=alias(u);ip.value=p;b.click();
    setTimeout(function(){
      var a=d.getElementById('appScreen');
      if(a&&!a.classList.contains('hidden')){cover.style.display='none';document.body.style.padding='0';frame.style.display='block'}
      else{msg.textContent='Usuario o passcode no reconocido.'}
    },300);
  });
}
document.getElementById('enter').addEventListener('click',login);
pass.addEventListener('keydown',function(e){if(e.key==='Enter')login()});
document.getElementById('recover').addEventListener('click',function(){wait(function(){var d=doc(),b=d.getElementById('recoverBtn');cover.style.display='none';document.body.style.padding='0';frame.style.display='block';if(b)b.click()})});
document.getElementById('join').addEventListener('click',function(){msg.textContent='La creación de membresía se abrirá desde NurseTrack.';});
})();
</script>
</body>
</html>
