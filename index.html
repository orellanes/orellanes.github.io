<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><meta name="theme-color" content="#0b63a8"><title>NurseTrack Clinical</title><style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f3f8f8;color:#17343c}.wrap{min-height:100vh;display:grid;place-items:center;padding:18px}.card{width:min(430px,100%);background:#fff;border:1px solid #d8e6e8;border-radius:24px;padding:28px;text-align:center;box-shadow:0 18px 55px rgba(35,74,82,.12)}.logo{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;margin:auto;background:#0b63a8;color:#fff;font-size:25px;font-weight:900}.badge{display:inline-block;margin:14px 0;padding:8px 12px;border-radius:999px;background:#edf5fb;border:1px solid #cfe2f0;color:#0b5f98;font-size:12px;font-weight:800}.muted{color:#6f858b;font-size:13px;line-height:1.5}.btn{display:block;text-decoration:none;margin-top:16px;padding:13px;border-radius:12px;background:linear-gradient(90deg,#073e6d,#0b63a8);color:#fff;font-weight:800}</style></head><body><div class="wrap"><div class="card"><div class="logo">NT</div><h1>NurseTrack Clinical</h1><div class="badge">ENTRADA ÚNICA · SIEMPRE ACTUALIZADA</div><div class="muted">Buscando automáticamente la versión más reciente disponible…</div><a class="btn" id="enterBtn" href="#">Entrar a NurseTrack</a></div></div><script>(async function(){var build=String(Date.now());try{var r=await fetch('nursetrack-version.json?t='+Date.now(),{cache:'no-store'});if(r.ok){var j=await r.json();if(j&&j.build)build=String(j.build)}}catch(e){}var u='app-safe6.html?v='+encodeURIComponent(build);document.getElementById('enterBtn').href=u;location.replace(u)})();</script></body></html>
