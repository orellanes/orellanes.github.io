<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef8f7">
<title>NurseTrack Clinical</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#eef8f7;color:#23464f}body{overflow:hidden}
#cover{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 16px max(12px,env(safe-area-inset-bottom));background:linear-gradient(180deg,#eaf7f5 0%,#f8fbf7 58%,#fff7e9 100%);z-index:20}
.card{width:min(520px,100%);height:min(900px,100%);display:flex;flex-direction:column;justify-content:center;gap:clamp(8px,1.25vh,13px);padding:clamp(10px,2vh,22px) clamp(16px,4vw,28px);overflow:hidden}
.brand{text-align:center}.emblem{position:relative;width:clamp(64px,9.5vh,86px);height:clamp(64px,9.5vh,86px);margin:0 auto 7px;border-radius:50%;border:2px solid #91cec8;background:#e6f6f3;display:grid;place-items:center;color:#168d94;font-size:clamp(32px,4.5vh,42px);font-weight:800;line-height:1}.leaf{position:absolute;width:20px;height:11px;border-radius:100% 0 100% 0;background:#7fb89c;bottom:7px}.leaf.l{left:16px;transform:rotate(24deg)}.leaf.r{right:16px;transform:scaleX(-1) rotate(24deg)}
h1{margin:0;font-size:clamp(29px,4.5vh,43px);line-height:1.02;letter-spacing:-.03em;color:#0d4c61}.teal{color:#168e97}.subtitle{margin-top:5px;font-size:clamp(12px,1.8vh,16px);font-weight:600;color:#657c83}
.service{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:10px;padding:clamp(8px,1.25vh,12px) 14px;border:1px solid #cfe4e2;border-radius:16px;background:rgba(255,255,255,.76)}.pin{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e7f6f3;border:1px solid #badeda;color:#168e97;font-size:21px}.service strong{display:block;font-size:13px;color:#29515a}.service small{display:block;margin-top:2px;font-size:11px;color:#788b90}
.login{padding:clamp(11px,1.7vh,15px);border:1px solid #d6e6e5;border-radius:18px;background:rgba(255,255,255,.9)}label{display:block;font-size:12px;font-weight:800;margin:0 0 5px;color:#2d5059}.field{margin-bottom:9px}input{width:100%;height:clamp(43px,5.7vh,50px);border:1px solid #cbdcde;border-radius:12px;background:#fff;padding:0 13px;color:#23474f;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}input:focus{border-color:#2d98a0;box-shadow:0 0 0 3px rgba(45,152,160,.12)}button{width:100%;height:clamp(43px,5.7vh,50px);border-radius:12px;font-size:15px;font-weight:800;touch-action:manipulation;-webkit-tap-highlight-color:transparent}.enter{border:1px solid #178f9a;background:#178f9a;color:#fff}.recover{margin-top:8px;border:1px solid #79bbc0;background:transparent;color:#197f87}.footer{display:flex;align-items:center;justify-content:center;gap:9px;padding:3px 8px;color:#557178}.heart{font-size:24px;color:#188f91}.footer strong{display:block;font-size:12px;color:#31535c}.footer small{display:block;font-size:10px;color:#7a8c90}
#appFrame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f7f8;display:none;z-index:10}
#msg{text-align:center;min-height:16px;font-size:11px;color:#7c6a2f}
@media(max-height:650px){.card{gap:5px;padding-top:6px;padding-bottom:6px}.emblem{width:52px;height:52px;font-size:27px;margin-bottom:2px}.leaf{width:15px;height:8px;bottom:4px}.leaf.l{left:11px}.leaf.r{right:11px}h1{font-size:27px}.subtitle{font-size:11px}.service{padding:6px 10px}.pin{width:32px;height:32px}.login{padding:9px}.field{margin-bottom:6px}.footer{padding:0}}
</style>
</head>
<body>
<div id="cover">
  <div class="card">
    <div class="brand">
      <div class="emblem" aria-hidden="true">✚<span class="leaf l"></span><span class="leaf r"></span></div>
      <h1>NurseTrack <span class="teal">Clinical</span></h1>
      <div class="subtitle">Censo · enfermería · seguimiento clínico</div>
    </div>
    <div class="service">
      <div class="pin">⌖</div>
      <div><strong>Dirección del servicio</strong><small>Información del servicio o unidad clínica</small></div>
    </div>
    <div class="login">
      <div class="field"><label for="user">Usuario</label><input id="user" autocomplete="username" autocapitalize="none" placeholder="Usuario"></div>
      <div class="field"><label for="pass">Passcode</label><input id="pass" type="password" autocomplete="current-password" placeholder="Letras, números y símbolos"></div>
      <button id="enter" class="enter" type="button">Entrar</button>
      <button id="recover" class="recover" type="button">Restablecer contraseña</button>
      <div id="msg"></div>
    </div>
    <div class="footer"><div class="heart">♡✚</div><div><strong>Cuidamos lo más importante</strong><small>Información segura · atención de calidad · mejores resultados</small></div></div>
  </div>
</div>
<iframe id="appFrame" src="index%20(3).html?v=294" title="NurseTrack Clinical"></iframe>
<script>
(function(){
  var AUTH='nursetrack_clinical_auth_v21';
  var cover=document.getElementById('cover'),frame=document.getElementById('appFrame'),user=document.getElementById('user'),pass=document.getElementById('pass'),enter=document.getElementById('enter'),recover=document.getElementById('recover'),msg=document.getElementById('msg');
  var ready=false;
  frame.addEventListener('load',function(){
    ready=true;
    try{
      var d=doc();
      if(d&&!d.getElementById('ntAdminCenterLoader')){
        var s=d.createElement('script');s.id='ntAdminCenterLoader';s.src='admin-center.js?v=291';d.head.appendChild(s);
      }
    }catch(e){}
  });
  function doc(){try{return frame.contentDocument||frame.contentWindow.document}catch(e){return null}}
  function waitReady(cb){if(ready&&doc()){cb();return}msg.textContent='Abriendo NurseTrack…';var tries=0,t=setInterval(function(){tries++;if((ready&&doc())||tries>30){clearInterval(t);msg.textContent='';if(ready&&doc())cb();else alert('NurseTrack todavía está cargando. Intente nuevamente.')}},100)}
  function showAppWhenOpen(d){setTimeout(function(){var a=d.getElementById('appScreen'),l=d.getElementById('loginScreen');if(a&&!a.classList.contains('hidden')){cover.style.display='none';frame.style.display='block';msg.textContent='';}else{frame.style.display='none';cover.style.display='flex';}},220)}
  function resolveAdminAlias(entered){
    var low=String(entered||'').trim().toLowerCase();
    if(low!=='admin'&&low!=='administrador')return entered;
    try{
      var raw=localStorage.getItem(AUTH),a=raw?JSON.parse(raw):null;
      if(a&&a.name){
        if(!a.role){a.role='Administrador principal';localStorage.setItem(AUTH,JSON.stringify(a));}
        try{if(frame.contentWindow&&frame.contentWindow.auth&&!frame.contentWindow.auth.role)frame.contentWindow.auth.role='Administrador principal';}catch(e){}
        return a.name;
      }
    }catch(e){}
    return entered;
  }
  function doLogin(){var u=user.value.trim(),p=pass.value;if(!u){alert('Escriba el usuario.');user.focus();return}if(!p){alert('Escriba el passcode.');pass.focus();return}waitReady(function(){var d=doc(),iu=d&&d.getElementById('loginName'),ip=d&&d.getElementById('loginPin'),b=d&&d.getElementById('loginBtn');if(!iu||!ip||!b){alert('No se pudo abrir el acceso de NurseTrack.');return}iu.value=resolveAdminAlias(u);ip.value=p;b.click();showAppWhenOpen(d);});}
  enter.addEventListener('click',doLogin);
  pass.addEventListener('keydown',function(e){if(e.key==='Enter')doLogin();});
  recover.addEventListener('click',function(){waitReady(function(){var d=doc(),b=d&&d.getElementById('recoverBtn');frame.style.display='block';cover.style.display='none';if(b)b.click();});});
  setInterval(function(){if(frame.style.display!=='block')return;var d=doc();if(!d)return;var a=d.getElementById('appScreen'),l=d.getElementById('loginScreen');if(l&&!l.classList.contains('hidden')&&(!a||a.classList.contains('hidden'))){frame.style.display='none';cover.style.display='flex';pass.value='';}},700);
})();
</script>
</body>
</html>
