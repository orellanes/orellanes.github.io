<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>NurseTrack Clinical</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f9f8}#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f3f9f8}#loginTap,#recoverTap{position:fixed;border:0;background:transparent;opacity:.001;z-index:2147483647;-webkit-tap-highlight-color:transparent;touch-action:manipulation;display:none}</style></head><body><iframe id="app" src="index%20(2).html?v=2810" title="NurseTrack Clinical"></iframe><button id="loginTap" aria-label="Entrar"></button><button id="recoverTap" aria-label="Restablecer contraseña"></button><script>(function(){var f=document.getElementById('app'),loginTap=document.getElementById('loginTap'),recoverTap=document.getElementById('recoverTap');function place(){try{var d=f.contentDocument;if(!d)return;var s=d.getElementById('loginScreen'),b=d.getElementById('loginBtn'),r=d.getElementById('recoverBtn'),u=d.getElementById('loginName'),p=d.getElementById('loginPin');[u,p,b,r].forEach(function(el){if(el){el.style.pointerEvents='auto';el.style.zIndex='99999';el.style.touchAction='manipulation'}});var visible=s&&!s.classList.contains('hidden');[[loginTap,b],[recoverTap,r]].forEach(function(pair){var o=pair[0],el=pair[1];if(!visible||!el){o.style.display='none';return}var x=el.getBoundingClientRect();o.style.left=x.left+'px';o.style.top=x.top+'px';o.style.width=x.width+'px';o.style.height=x.height+'px';o.style.display='block'})}catch(e){}}function fire(id){try{var d=f.contentDocument,el=d&&d.getElementById(id);if(el){el.click();setTimeout(place,80)}}catch(e){}}loginTap.addEventListener('click',function(e){e.preventDefault();fire('loginBtn')});recoverTap.addEventListener('click',function(e){e.preventDefault();fire('recoverBtn')});f.addEventListener('load',function(){place();setTimeout(place,250);setTimeout(place,800);try{var d=f.contentDocument;if(d){new MutationObserver(place).observe(d.documentElement,{attributes:true,subtree:true,attributeFilter:['class','style']})}}catch(e){}});window.addEventListener('resize',place);setInterval(place,600)})();</script></body></html>
