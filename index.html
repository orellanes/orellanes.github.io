<div id="cloudReset"><div class="card"><div class="brand"><div class="emblem">✚</div><h1>NurseTrack <span class="teal">Clinical</span></h1></div><div class="resetbox"><h2>Crear nueva contraseña</h2><p>Escriba la nueva contraseña de su cuenta de nube.</p><div class="field"><label>Nueva contraseña</label><input id="cloudNewPass" type="password" autocomplete="new-password"></div><div class="field"><label>Confirmar nueva contraseña</label><input id="cloudNewPass2" type="password" autocomplete="new-password"></div><button id="cloudResetBtn" class="enter" type="button">Guardar nueva contraseña</button><div id="cloudResetMsg"></div></div></div></div>

(function(){
