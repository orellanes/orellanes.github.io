<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de acceso</title>
<style>
body{font-family:Arial,sans-serif;background:#eef8f7;margin:0;padding:40px 20px;color:#23464f}
main{max-width:420px;margin:auto;background:white;padding:24px;border-radius:16px;border:1px solid #cfe4e2}
h1{font-size:24px;margin-top:0}label{display:block;font-weight:700;margin:16px 0 6px}input{width:100%;box-sizing:border-box;height:48px;font-size:18px;padding:0 12px;border:1px solid #9fb8bb;border-radius:10px;background:white;color:#111}button{width:100%;height:48px;margin-top:18px;font-size:17px;border:0;border-radius:10px;background:#178f9a;color:white;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Prueba de acceso NurseTrack</h1>
<label for="u">Usuario</label>
<input id="u" name="u" type="text" autocomplete="username">
<label for="p">Passcode</label>
<input id="p" name="p" type="password" autocomplete="current-password">
<button type="button">Prueba</button>
</main>
</body>
</html>
